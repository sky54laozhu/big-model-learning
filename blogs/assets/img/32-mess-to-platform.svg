<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">平台 = 网关放大到跨团队尺度</title>
  <desc id="d">左边没有平台：多个业务团队各自内部都重复塞着「网关·eval·密钥·账本」一整套横切逻辑，线路乱七八糟连向三家模型厂商，横切逻辑重复 N 份、密钥泄漏面 ×N、账算不清、坏邻居互相殃及；右边有平台：各业务团队只对一层 AI 平台说话，横切逻辑收口进平台一层（网关·路由·eval·密钥·治理·计量），平台再统一对接三家厂商，线路清爽。核心是把 Blog27 网关那招从跨调用点放大到跨团队。</desc>
  <style>
    .h  { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .sub{ font-weight: 700; font-size: 14px; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ef4444"/></marker>
  </defs>

  <text x="34" y="32" class="h">同一件横切的事：散在 N 个团队　vs　收口成一个平台</text>

  <line x1="450" y1="58" x2="450" y2="440" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: no platform ============ -->
  <text x="40" y="74" class="sub" fill="#b91c1c">❌ 没有平台：横切逻辑重复 ×N 份</text>

  <!-- team boxes with repeated red badge -->
  <g>
    <rect x="40" y="92" width="158" height="58" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="119" y="112" text-anchor="middle" font-weight="700" fill="#334155">客服团队</text>
    <rect x="52" y="120" width="134" height="22" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="119" y="135" text-anchor="middle" font-size="10.5" fill="#b91c1c">网关·eval·密钥·账本</text>
  </g>
  <g>
    <rect x="40" y="158" width="158" height="58" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="119" y="178" text-anchor="middle" font-weight="700" fill="#334155">电商团队</text>
    <rect x="52" y="186" width="134" height="22" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="119" y="201" text-anchor="middle" font-size="10.5" fill="#b91c1c">网关·eval·密钥·账本</text>
  </g>
  <g>
    <rect x="40" y="224" width="158" height="58" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="119" y="244" text-anchor="middle" font-weight="700" fill="#334155">风控团队</text>
    <rect x="52" y="252" width="134" height="22" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="119" y="267" text-anchor="middle" font-size="10.5" fill="#b91c1c">网关·eval·密钥·账本</text>
  </g>
  <g>
    <rect x="40" y="290" width="158" height="58" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="119" y="310" text-anchor="middle" font-weight="700" fill="#334155">法务团队 … ×8</text>
    <rect x="52" y="318" width="134" height="22" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="119" y="333" text-anchor="middle" font-size="10.5" fill="#b91c1c">网关·eval·密钥·账本</text>
  </g>

  <!-- providers left -->
  <rect x="330" y="118" width="92" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="376" y="140" text-anchor="middle" font-weight="700" fill="#475569">Anthropic</text>
  <rect x="330" y="203" width="92" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="376" y="225" text-anchor="middle" font-weight="700" fill="#475569">OpenAI</text>
  <rect x="330" y="288" width="92" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="376" y="310" text-anchor="middle" font-weight="700" fill="#475569">GLM</text>

  <!-- messy crossing arrows -->
  <line x1="200" y1="128" x2="328" y2="132" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="200" y1="194" x2="328" y2="136" stroke="#ef4444" stroke-width="1.1" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="200" y1="200" x2="328" y2="216" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="200" y1="260" x2="328" y2="220" stroke="#ef4444" stroke-width="1.1" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="200" y1="266" x2="328" y2="300" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="200" y1="326" x2="328" y2="304" stroke="#ef4444" stroke-width="1.1" opacity="0.6" marker-end="url(#arr)"/>
  <line x1="200" y1="132" x2="328" y2="296" stroke="#ef4444" stroke-width="1.1" opacity="0.5" marker-end="url(#arr)"/>

  <text x="230" y="372" text-anchor="middle" font-size="11.5" fill="#b91c1c">密钥泄漏面 ×8，账算不清，坏邻居互相殃及</text>

  <!-- ============ RIGHT: with platform ============ -->
  <text x="470" y="74" class="sub" fill="#166534">✅ 有平台：横切逻辑收口一处</text>

  <!-- team boxes right -->
  <rect x="466" y="98" width="112" height="34" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="522" y="120" text-anchor="middle" font-weight="700" fill="#334155">客服团队</text>
  <rect x="466" y="160" width="112" height="34" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="522" y="182" text-anchor="middle" font-weight="700" fill="#334155">电商团队</text>
  <rect x="466" y="222" width="112" height="34" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="522" y="244" text-anchor="middle" font-weight="700" fill="#334155">风控团队</text>
  <rect x="466" y="284" width="112" height="34" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="522" y="306" text-anchor="middle" font-weight="700" fill="#334155">法务 … ×8</text>
  <text x="522" y="336" text-anchor="middle" font-size="10.5" fill="#64748b">只说统一格式</text>

  <!-- platform -->
  <rect x="626" y="116" width="118" height="200" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="685" y="140" text-anchor="middle" font-weight="700" font-size="14" fill="#1e40af">AI 平台</text>
  <rect x="640" y="152" width="90" height="150" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="685" y="173" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">收口一处</text>
  <text x="685" y="193" text-anchor="middle" font-size="10.5" fill="#166534">网关 · 路由</text>
  <text x="685" y="213" text-anchor="middle" font-size="10.5" fill="#166534">eval · 密钥</text>
  <text x="685" y="233" text-anchor="middle" font-size="10.5" fill="#166534">治理 · 审计</text>
  <text x="685" y="253" text-anchor="middle" font-size="10.5" fill="#166534">计量 · 配额</text>
  <text x="685" y="273" text-anchor="middle" font-size="10.5" fill="#166534">租户隔离</text>
  <text x="685" y="293" text-anchor="middle" font-size="10.5" fill="#166534">= paved road</text>

  <!-- providers right -->
  <rect x="788" y="120" width="92" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="834" y="141" text-anchor="middle" font-weight="700" fill="#475569">Anthropic</text>
  <rect x="788" y="200" width="92" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="834" y="221" text-anchor="middle" font-weight="700" fill="#475569">OpenAI</text>
  <rect x="788" y="280" width="92" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="834" y="301" text-anchor="middle" font-weight="700" fill="#475569">GLM</text>

  <!-- clean arrows -->
  <line x1="580" y1="115" x2="624" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="580" y1="177" x2="624" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="580" y1="239" x2="624" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="580" y1="301" x2="624" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="746" y1="180" x2="786" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="746" y1="214" x2="786" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="746" y1="248" x2="786" y2="292" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="685" y="372" text-anchor="middle" font-size="11.5" fill="#166534">一份逻辑，全公司复用</text>

  <!-- bottom takeaway -->
  <text x="450" y="416" text-anchor="middle" font-size="11.5" fill="#6b7280">平台 = Blog 27 网关那一招，从「跨调用点」放大到「跨团队」</text>
  <text x="450" y="436" text-anchor="middle" font-size="11.5" fill="#1e40af">它不是代收费的中间商，而是一条 paved road：让每个团队默认就做对</text>
</svg>
