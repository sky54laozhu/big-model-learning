<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">确定到自主的光谱</title>
  <desc id="d">一条从左到右的光谱：最左是写死的 if/switch 代码（Routing 的分派段），中间偏左是模型在固定槽位做受约束决策（Routing 的分类、Prompt chaining 链式、Parallelization 并行），最右是模型自己开 while 循环跑到底（第 24 篇 Agent）。越往右模型决策权越大、越不可控；工程师按任务把决策权一刀一刀切给光谱上不同的位置。</desc>
  <style>
    .h  { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .bx { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .bs { font-size: 11px; text-anchor: middle; }
    .end{ font-weight: 700; font-size: 13px; }
    .lb { font-size: 11.5px; text-anchor: middle; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#64748b"/></marker>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>

  <text x="40" y="36" class="h">Workflow ↔ Agent：不是两类任务，是一条光谱</text>

  <!-- spectrum bar -->
  <rect x="60" y="92" width="760" height="20" rx="10" fill="url(#grad)"/>
  <line x1="60" y1="138" x2="826" y2="138" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="60" y="84" class="end" fill="#92400e">← 确定（你写死）</text>
  <text x="700" y="84" class="end" fill="#166534">自主（模型说了算）→</text>

  <!-- ticks -->
  <line x1="150" y1="84" x2="150" y2="120" stroke="#475569" stroke-width="1.4"/>
  <line x1="370" y1="84" x2="370" y2="120" stroke="#475569" stroke-width="1.4"/>
  <line x1="540" y1="84" x2="540" y2="120" stroke="#475569" stroke-width="1.4"/>
  <line x1="740" y1="84" x2="740" y2="120" stroke="#475569" stroke-width="1.4"/>

  <!-- col 1 -->
  <rect x="70" y="170" width="170" height="92" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="155" y="196" class="bx" fill="#92400e">写死的 if/switch</text>
  <text x="155" y="218" class="bs" fill="#92400e">模型不参与决策</text>
  <text x="155" y="240" class="bs" fill="#b45309">Routing 的②分派</text>

  <!-- col 2 -->
  <rect x="290" y="170" width="200" height="92" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="390" y="196" class="bx" fill="#1e40af">固定槽位里决策</text>
  <text x="390" y="218" class="bs" fill="#1e40af">模型受约束、吐完即止</text>
  <text x="390" y="240" class="bs" fill="#2563eb">分类① / 链式 / 并行</text>

  <!-- col 3 -->
  <rect x="630" y="170" width="200" height="92" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="730" y="196" class="bx" fill="#166534">自己开循环跑到底</text>
  <text x="730" y="218" class="bs" fill="#166534">模型决策每步 + 何时停</text>
  <text x="730" y="240" class="bs" fill="#15803d">第 24 篇 Agent</text>

  <text x="440" y="312" class="lb">工程师按任务，把决策权一刀一刀切给光谱上不同的位置 —— 能写死的写死，能 Workflow 别上 Agent</text>
</svg>
