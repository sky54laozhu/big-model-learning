<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">主控制流程图：loop.ts 每轮开口前两次自检，shouldRemindTodo 内部倒扫双阈值判断</title>
  <desc id="d">loop.ts 主 for 循环每一轮开口前依次做两次自检——先 shouldAutoCompact（实战09，历史顶到窗口阈值就整段替换），再 shouldRemindTodo（本篇，两把尺子现算）。shouldRemindTodo 内部调用 getTodoReminderTurnCounts 倒着扫当前 messages：找最近一条带 todo_write 工具调用的 assistant 消息记 turnsSinceLastTodoWrite，找最近一条 role:user 且 isMeta 为真的消息记 turnsSinceLastReminder，两者都找到或扫到头就停。两个计数都过各自阈值（10 轮）才返回 true。true 分支：调用 buildTodoReminderMessage——读 todo_write.ts 导出的 getCurrentTodos() 活对象取当前清单内容，拼出带"当前清单内容"段落的文案，包一层 &lt;system-reminder&gt; 标签，包成 role:user、isMeta:true 的消息对象；这条消息像其他消息一样 push 进 messages 并 await record() 落盘（回扣实战10 Layer A）。之后才进入 streamChat 消费这一轮的模型请求。另一条独立支线：todo_write 工具被模型调用时（跟 read_file/write_file/bash 等工具走同一条 runWithGate 执行路径），execute 直接给模块级 currentTodos 赋新值——下一次 buildTodoReminderMessage 读到的就是这份最新内容。</desc>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">主控制流程：两次每轮自检 —— shouldAutoCompact 之后接 shouldRemindTodo</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#475569">灰虚线 = 沿用旧实现　·　琥珀 = 本章新增　·　右侧独立支线 = todo_write 工具执行回路</text>

  <!-- ① for loop -->
  <rect x="300" y="66" width="300" height="40" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="450" y="91" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">① for (turn = 1; turn ≤ maxTurns; turn++)</text>

  <line x1="450" y1="106" x2="450" y2="126" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#94a3b8" transform="translate(450,130)"/>

  <!-- ② shouldAutoCompact -->
  <rect x="270" y="132" width="360" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="450" y="154" text-anchor="middle" font-size="10.8" font-weight="700" fill="#475569">② shouldAutoCompact(messages, model)（实战09）</text>
  <text x="450" y="172" text-anchor="middle" font-size="9.3" fill="#64748b">历史顶到窗口阈值 → compactMessages 整段替换 messages</text>

  <line x1="450" y1="188" x2="450" y2="206" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#94a3b8" transform="translate(450,210)"/>

  <!-- ③ shouldRemindTodo 外框 -->
  <rect x="70" y="216" width="760" height="430" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.2"/>
  <text x="450" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">③ shouldRemindTodo(messages) —— 本章新增</text>

  <!-- getTodoReminderTurnCounts 倒扫 -->
  <rect x="100" y="254" width="700" height="112" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="450" y="274" text-anchor="middle" font-size="10.3" font-weight="700" fill="#92400e">getTodoReminderTurnCounts(messages) —— 倒着扫一遍当前 messages</text>

  <rect x="120" y="286" width="320" height="66" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="280" y="304" text-anchor="middle" font-size="9.3" fill="#92400e">找最近一条带 todo_write 调用</text>
  <text x="280" y="318" text-anchor="middle" font-size="9.3" fill="#92400e">的 assistant 消息</text>
  <text x="280" y="336" text-anchor="middle" font-size="9.3" font-weight="700" fill="#92400e">→ turnsSinceLastTodoWrite</text>

  <rect x="460" y="286" width="320" height="66" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="620" y="304" text-anchor="middle" font-size="9.3" fill="#92400e">找最近一条 role:user 且</text>
  <text x="620" y="318" text-anchor="middle" font-size="9.3" fill="#92400e">isMeta 为真的消息</text>
  <text x="620" y="336" text-anchor="middle" font-size="9.3" font-weight="700" fill="#92400e">→ turnsSinceLastReminder</text>

  <text x="450" y="358" text-anchor="middle" font-size="8.8" fill="#a16207">两者都找到，或扫到 messages 开头，就停</text>

  <line x1="450" y1="366" x2="450" y2="384" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#b45309" transform="translate(450,388)"/>

  <!-- 阈值判断 -->
  <rect x="220" y="392" width="460" height="46" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="450" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">两个计数都 ≥ 10（TODO_REMINDER_CONFIG）？</text>
  <text x="450" y="428" text-anchor="middle" font-size="9" fill="#a16207">好久没写 &amp; 好久没提醒过 —— 两把尺子都过线</text>

  <g stroke="#b45309" stroke-width="1.5" fill="none">
    <line x1="330" y1="438" x2="200" y2="460"/>
    <line x1="570" y1="438" x2="580" y2="460"/>
  </g>
  <polygon points="-5,-8 5,-8 0,0" fill="#b45309" transform="translate(196,463) rotate(65)"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#b45309" transform="translate(583,463) rotate(-65)"/>

  <text x="180" y="454" text-anchor="middle" font-size="9.3" font-weight="700" fill="#b91c1c">否</text>
  <text x="600" y="454" text-anchor="middle" font-size="9.3" font-weight="700" fill="#166534">是</text>

  <!-- 否分支：直接略过 -->
  <rect x="100" y="466" width="200" height="42" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="491" text-anchor="middle" font-size="9.3" fill="#475569">跳过，不塞提醒</text>

  <!-- 是分支：buildTodoReminderMessage -->
  <rect x="380" y="466" width="420" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.7"/>
  <text x="590" y="486" text-anchor="middle" font-size="10.3" font-weight="700" fill="#92400e">buildTodoReminderMessage()</text>
  <text x="590" y="503" text-anchor="middle" font-size="9" fill="#a16207">读 todo_write.ts 导出的 getCurrentTodos() 活对象</text>
  <text x="590" y="518" text-anchor="middle" font-size="9" fill="#a16207">取当前清单内容，拼进"当前清单内容"段落</text>

  <line x1="590" y1="526" x2="590" y2="544" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#b45309" transform="translate(590,548)"/>

  <rect x="440" y="550" width="300" height="42" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="590" y="576" text-anchor="middle" font-size="9.3" fill="#92400e">包一层 &lt;system-reminder&gt; 标签</text>

  <line x1="590" y1="592" x2="590" y2="610" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#b45309" transform="translate(590,614)"/>

  <rect x="400" y="616" width="380" height="44" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="590" y="638" text-anchor="middle" font-size="9.6" font-weight="700" fill="#92400e">role:'user', isMeta:true 消息对象</text>
  <text x="590" y="653" text-anchor="middle" font-size="8.6" fill="#a16207">跟其他消息同形状</text>

  <!-- 汇聚：否分支与是分支都指向下方的 push+record -->
  <line x1="200" y1="508" x2="200" y2="628" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="590" y1="660" x2="590" y2="628" stroke="#b45309" stroke-width="1.6"/>
  <line x1="200" y1="628" x2="590" y2="628" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <line x1="450" y1="628" x2="450" y2="656" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#94a3b8" transform="translate(450,660)"/>

  <!-- push+record box（挪到 shouldRemindTodo 外框之外，紧邻其下方） -->
  <rect x="290" y="666" width="320" height="42" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="450" y="686" text-anchor="middle" font-size="9.6" font-weight="700" fill="#92400e">messages.push(reminder) + await record(reminder)</text>
  <text x="450" y="700" text-anchor="middle" font-size="8.6" fill="#a16207">回扣实战10 Layer A：跟其他消息一样落盘</text>

  <!-- ④ streamChat -->
  <line x1="450" y1="708" x2="450" y2="726" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#94a3b8" transform="translate(450,730)"/>

  <rect x="270" y="736" width="360" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="450" y="758" text-anchor="middle" font-size="10.8" font-weight="700" fill="#475569">④ streamChat(messages, tools, system)</text>
  <text x="450" y="776" text-anchor="middle" font-size="9.3" fill="#64748b">消费这一轮请求（实战05/06/08：流式+权限+重试，原样沿用）</text>

  <!-- 右侧独立支线：todo_write 执行回路 -->
  <rect x="640" y="850" width="220" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="750" y="874" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">独立支线</text>
  <text x="750" y="892" text-anchor="middle" font-size="9.3" fill="#92400e">模型调用 todo_write 工具</text>
  <text x="750" y="908" text-anchor="middle" font-size="9" fill="#a16207">走同一条 runWithGate 执行路径</text>
  <text x="750" y="926" text-anchor="middle" font-size="9" fill="#a16207">（跟 read_file/write_file/bash 等一样）</text>
  <text x="750" y="948" text-anchor="middle" font-size="9.3" font-weight="700" fill="#92400e">execute() 给模块级</text>
  <text x="750" y="964" text-anchor="middle" font-size="9.3" font-weight="700" fill="#92400e">currentTodos 赋新值</text>
  <text x="750" y="984" text-anchor="middle" font-size="8.6" fill="#a16207">整体替换，不是增量合并</text>

  <!-- 虚线箭头：从④回到独立支线（模型这一轮消费提醒后可能调用 todo_write） -->
  <path d="M 630 764 C 700 790, 750 810, 750 846" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#94a3b8" transform="translate(750,850) rotate(90)"/>

  <!-- 虚线箭头：从独立支线回到 getCurrentTodos（下一次调用会读到新内容） -->
  <path d="M 640 900 C 500 900, 480 700, 590 508" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="-5,-8 5,-8 0,0" fill="#b91c1c" transform="translate(592,502) rotate(-8)"/>
  <text x="500" y="700" text-anchor="middle" font-size="8.4" fill="#b91c1c" transform="rotate(-84 500 700)">下一次 buildTodoReminderMessage 读到最新内容</text>

  <!-- 结论 -->
  <rect x="60" y="1020" width="780" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="450" y="1044" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">两次自检同一种性质：每轮开口前，先看一眼 messages 决定要不要插东西</text>
  <text x="450" y="1064" text-anchor="middle" font-size="10" fill="#475569">shouldAutoCompact 决定要不要"整段替换"；shouldRemindTodo 决定要不要"追加一条"</text>
  <text x="450" y="1082" text-anchor="middle" font-size="10" fill="#475569">todo_write 的执行结果不经过这条主检查链路，靠模块级活对象直接旁路写入（折叠点⑥）</text>
  <text x="450" y="1100" text-anchor="middle" font-size="9.3" fill="#64748b">■ 灰色虚线 = 沿用实战09/05/06/08　　■ 琥珀色 = 本章新增</text>
</svg>
