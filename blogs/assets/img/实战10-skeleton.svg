<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">实战10 骨架定位图</title>
  <desc id="d">调用方入口 index.ts 新增 --session-id/--resume 两个 flag 的解析与 UUID 校验。两条独立的状态支线从这里分叉。Layer A 支线：新增 src/uuid.ts（validateUuid 纯函数）+ src/session.ts（createSessionId/sessionIdExists/appendSessionEntry/loadSessionMessages，按 cwd 分桶存进 ~/.mini-harness/sessions/），loop.ts 内部每写一条新消息就顺手调用 appendSessionEntry。Layer B 支线：新增 src/memdir.ts（findGitRoot/getMemoryDir/loadMemoryPrompt，按 git 根目录分桶存进 ~/.mini-harness/memory/，两级结构 MEMORY.md 索引 + 主题文件），systemPrompt.ts 新增 includeAutoMemory 选项，把 loadMemoryPrompt 的结果拼进系统提示词，紧跟在 CLAUDE.md 项目规则之后。底部灰色虚线框：streamChat 消费、权限闸门、重试机制、压缩检查全部沿用实战02-09，一个字没改。</desc>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

