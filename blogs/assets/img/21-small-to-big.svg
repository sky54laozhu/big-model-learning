<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">small-to-big 父子分块：检索用小块、投喂用父块</title>
  <desc id="d">父子分块把检索粒度和投喂粒度解耦。左边：父文档切成小块①②③，逐块染色入库，小块主题单一所以染得准、容易命中，图中小块②被检索命中。中间：命中小块后不止用这个小块，而是取回它所在的父块。右边：投喂给模型的是父块（完整段落，含小块②加周围上下文），上下文完整、不会被切断语义，再拼三明治喂模型；而不是只喂那个小块否则上下文残缺。底部结论：检索粒度不等于投喂粒度，解耦后各取所长，破解第20篇切太小染得准但断语义、切太大不断但染得糊的死结。</desc>
  <style>
    .h { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .bx { font-size: 12px; text-anchor: middle; fill: #1f2937; }
    .cap { font-size: 11px; text-anchor: middle; fill: #374151; }
    .ex { font-size: 10px; text-anchor: middle; fill: #9ca3af; }
  </style>

  <text x="40" y="30" class="h">small-to-big 父子分块：检索用小、投喂用大</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
    <marker id="arb" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
  </defs>

  <!-- ===== 左：父文档切小块 ===== -->
  <rect x="50" y="64" width="200" height="200" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="150" y="86" class="bx" font-weight="700" fill="#4b5563">父文档 / 大段落</text>
  <rect x="68" y="98" width="164" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="150" y="124" class="bx" fill="#64748b">小块 ①</text>
  <rect x="68" y="148" width="164" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="174" class="bx" fill="#166534" font-weight="700">小块 ②　✓ 命中</text>
  <rect x="68" y="198" width="164" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="150" y="224" class="bx" fill="#64748b">小块 ③</text>
  <text x="150" y="284" class="cap" font-weight="700" fill="#166534">① 检索用小块 → 染得准、易命中</text>

  <!-- ===== 中：small → big ===== -->
  <text x="350" y="150" class="cap" font-weight="700" fill="#5b21b6">命中小块 → 取回父块</text>
  <text x="350" y="168" class="ex" fill="#7c3aed">small → big</text>
  <path d="M250 178 L444 168" stroke="#7c3aed" stroke-width="2.4" fill="none" marker-end="url(#arb)"/>

  <!-- ===== 右：投喂父块 ===== -->
  <rect x="452" y="128" width="252" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="578" y="156" class="bx" font-weight="700" fill="#166534">父块（完整段落）</text>
  <text x="578" y="180" class="cap" fill="#15803d">含小块 ② ＋ 周围上下文</text>
  <path d="M578 200 L578 222" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <rect x="500" y="224" width="156" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="578" y="247" class="bx" fill="#1e40af">拼三明治 → 喂模型</text>
  <text x="578" y="284" class="cap" font-weight="700" fill="#166534">② 投喂用父块 → 上下文完整、不断语义</text>
  <text x="578" y="303" class="ex">（不是只喂那个小块，否则上下文残缺）</text>

  <!-- ===== 底部结论 ===== -->
  <line x1="40" y1="324" x2="820" y2="324" stroke="#e5e7eb" stroke-width="1"/>
  <text x="430" y="350" class="cap" font-weight="700" fill="#374151" font-size="12">检索粒度 ≠ 投喂粒度：解耦后各取所长，破第 20 篇「准 vs 断语义」那个死结。</text>
</svg>
