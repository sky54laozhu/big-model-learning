<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 780" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">骨架定位图：新增 retry.ts 共用模块，两端 provider 内部套一层 withRetry，loop.ts 新增 retry 事件处理</title>
  <desc id="d">本章新增 src/retry.ts：HttpError（带状态码的错误）、isRetryable（按状态码分类）、backoffDelay（指数退避 1s/2s/4s）、RetryExhaustedError（重试用尽的响亮失败）、withRetry（把这套节奏套在任意 runOnce 生成器外面）。types.ts 新增一种 StreamEvent：retry，独立频道系统通知。anthropic.ts 与 openai.ts 把各自原有的 fetch+SSE 解析整段搬进一个嵌套的 runOnce 异步生成器，外层 streamChat 变成 yield* withRetry(runOnce) 一行——协议差异继续留在各自 provider 内部，退避/分类/上限逻辑两端共用一份。runOnce 必须是具名的 async function*（异步生成器没有箭头函数写法），又要访问 this.base/this.model 这些实例字段，所以开头先 const self = this 存一份引用，内部改用 self. 访问。loop.ts 收到 retry 事件单独打一行警告，并清空这一轮攒到一半的 text/toolCalls。底部灰色框：SSE 解析、工具调用累积、权限闸门、系统提示词装配，全部沿用实战02-07，一个字没改。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">骨架定位：新增 retry.ts，两端 provider 套一层 withRetry</text>
  <text x="420" y="58" text-anchor="middle" font-size="13" fill="#475569">loop.ts 收到 retry 事件单开一行；两端 streamChat 内部包一层 runOnce，外面套 yield* withRetry(runOnce)（灰=不变，琥珀=新增/改动）</text>

  <!-- retry.ts 新模块 -->
  <rect x="250" y="80" width="340" height="142" rx="10" fill="#fffbeb" stroke="#1e293b" stroke-width="2.6"/>
  <text x="420" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">retry.ts（本章新增，两端 provider 共用）</text>

  <rect x="266" y="112" width="308" height="22" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="127" text-anchor="middle" font-size="9.3" fill="#475569">① HttpError / RetryExhaustedError（带状态码/次数）</text>

  <rect x="266" y="138" width="308" height="22" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="153" text-anchor="middle" font-size="9.3" fill="#475569">② isRetryable(status)：429/5xx/网络错误→可重试</text>

  <rect x="266" y="164" width="308" height="22" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="179" text-anchor="middle" font-size="9.3" fill="#475569">③ backoffDelay(attempt)：1s→2s→4s 指数退避</text>

  <rect x="266" y="190" width="308" height="22" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="420" y="205" text-anchor="middle" font-size="9.3" fill="#92400e">④ withRetry(runOnce)：MAX_RETRIES=3，套重试节奏</text>

  <!-- types.ts -->
  <rect x="640" y="80" width="160" height="142" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2.2"/>
  <text x="720" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338ca">types.ts</text>
  <text x="720" y="120" text-anchor="middle" font-size="9" fill="#4338ca">StreamEvent 原有</text>
  <text x="720" y="134" text-anchor="middle" font-size="9" fill="#4338ca">text_delta/tool_call/</text>
  <text x="720" y="148" text-anchor="middle" font-size="9" fill="#4338ca">done（不变）</text>
  <rect x="652" y="158" width="136" height="52" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="720" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">+ retry ← 新增</text>
  <text x="720" y="188" text-anchor="middle" font-size="8" fill="#92400e">attempt/maxRetries/</text>
  <text x="720" y="200" text-anchor="middle" font-size="8" fill="#92400e">delayMs/reason</text>

  <!-- 箭头：retry.ts → 两端 provider -->
  <line x1="330" y1="222" x2="220" y2="278" stroke="#b45309" stroke-width="2"/>
  <polygon points="212,286 216,272 228,280" fill="#b45309"/>
  <line x1="510" y1="222" x2="620" y2="278" stroke="#b45309" stroke-width="2"/>
