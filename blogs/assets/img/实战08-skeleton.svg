  <rect x="40" y="500" width="760" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="56" y="522" font-size="12.5" font-weight="700" fill="#475569">loop.ts · runAgent()：for await 消费 provider.streamChat() 的事件流</text>
  <rect x="58" y="534" width="726" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="420" y="551" text-anchor="middle" font-size="9.8" fill="#475569">text_delta → 累积 text；tool_call → push 进 toolCalls[]（不变，实战06）</text>
  <rect x="58" y="566" width="726" height="34" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
