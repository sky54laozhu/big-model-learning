<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">这颗"大脑"和你的不一样：缺四样，每样对应一件第四阶段补丁</title>
  <desc id="d">模型像一颗会抖、健忘、爱编的大脑，只管决策不能动手。它缺四样，每样对应一件工程补丁，正是第四阶段路线图：缺一没四肢能想不能动，补丁是工具调用，下一篇18；缺二记忆外挂是金鱼每轮重放，补丁是记忆与历史压缩，第23篇；缺三知识出厂烤死只读有截止点，补丁是RAG临时把外部资料喂到嘴边，第20到21篇；缺四分不清真懂还是在编会自信地幻觉，补丁是结构化校验与评估，第18和22篇。一句话：人脑知识是活的，模型知识是烤熟的。第四阶段就是给这颗大脑一件件装零件。</desc>
  <style>
    .h { font-weight: 700; fill: #1a1a1a; text-anchor: middle; font-size: 18px; }
    .lab { fill: #ffffff; font-weight: 700; font-size: 12.5px; text-anchor: middle; }
    .body { font-size: 11.5px; text-anchor: middle; }
    .sub { fill: #6b7280; font-size: 10.5px; text-anchor: middle; }
    .col { font-weight: 700; font-size: 12px; text-anchor: middle; }
  </style>

  <text x="440" y="30" class="h">这颗"大脑"和你的不一样</text>

  <!-- 中心：会抖的大脑 -->
  <ellipse cx="440" cy="92" rx="150" ry="40" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="440" y="84" class="body" fill="#b91c1c" font-weight="700" font-size="13.5">模型 = 一颗大脑（只管决策）</text>
  <text x="440" y="104" class="sub" fill="#dc2626">会抖 · 健忘 · 爱编 · 没手脚</text>
  <text x="440" y="121" class="sub" fill="#dc2626">回扣 17b：大脑出主意，四肢才动手</text>

  <!-- 列头 -->
  <text x="155" y="162" class="col" fill="#374151">缺这一样</text>
  <text x="445" y="162" class="col" fill="#374151">→ 补丁（工程手段）</text>
  <text x="775" y="162" class="col" fill="#374151">第四阶段篇目</text>

  <!-- 行 1：没四肢 → 工具调用（橙，下一篇） -->
  <rect x="40" y="174" width="800" height="58" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="155" y="198" class="body" fill="#92400e" font-weight="700">🦾 没四肢</text>
  <text x="155" y="218" class="sub" fill="#b45309">能想，不能动</text>
  <text x="445" y="198" class="body" fill="#92400e" font-weight="700">工具调用</text>
  <text x="445" y="218" class="sub" fill="#b45309">给它一双手去执行</text>
  <rect x="700" y="190" width="120" height="26" rx="13" fill="#fde68a"/>
  <text x="760" y="207" class="col" fill="#92400e">下一篇 · 18</text>

  <!-- 行 2：记忆外挂 → 记忆压缩（蓝） -->
  <rect x="40" y="240" width="800" height="50" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="155" y="262" class="body" fill="#1e40af" font-weight="700">🧠 记忆外挂</text>
  <text x="155" y="280" class="sub" fill="#1d4ed8">金鱼无状态 · 每轮重放</text>
  <text x="445" y="262" class="body" fill="#1e40af" font-weight="700">记忆与历史压缩</text>
  <text x="445" y="280" class="sub" fill="#1d4ed8">管好那个外挂笔记本</text>
  <rect x="710" y="252" width="100" height="26" rx="13" fill="#bfdbfe"/>
  <text x="760" y="269" class="col" fill="#1e40af">23 记忆</text>

  <!-- 行 3：知识烤死 → RAG（绿） -->
  <rect x="40" y="298" width="800" height="50" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="155" y="320" class="body" fill="#166534" font-weight="700">📚 知识烤死</text>
  <text x="155" y="338" class="sub" fill="#15803d">只读 · 有知识截止点</text>
  <text x="445" y="320" class="body" fill="#166534" font-weight="700">RAG（检索增强）</text>
  <text x="445" y="338" class="sub" fill="#15803d">临时把外部资料喂到嘴边</text>
  <rect x="700" y="310" width="120" height="26" rx="13" fill="#bbf7d0"/>
  <text x="760" y="327" class="col" fill="#166534">20 / 21 RAG</text>

  <!-- 行 4：分不清真假 → 校验/评估（紫） -->
  <rect x="40" y="356" width="800" height="50" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="155" y="378" class="body" fill="#5b21b6" font-weight="700">🎲 分不清真假</text>
  <text x="155" y="396" class="sub" fill="#6d28d9">"记得"和"编"同一套概率</text>
  <text x="445" y="378" class="body" fill="#5b21b6" font-weight="700">结构化校验 / 评估</text>
  <text x="445" y="396" class="sub" fill="#6d28d9">用确定手段卡住、给它打分</text>
  <rect x="700" y="368" width="120" height="26" rx="13" fill="#ddd6fe"/>
  <text x="760" y="385" class="col" fill="#5b21b6">18 校验 · 22 评估</text>

  <!-- 底部金句 -->
  <rect x="40" y="424" width="800" height="32" rx="8" fill="#fef2f2"/>
  <text x="440" y="445" class="body" fill="#b91c1c" font-weight="700">人脑知识是「活的」，模型知识是「烤熟的」 · 第四阶段＝给这颗大脑一件件装零件</text>
</svg>
