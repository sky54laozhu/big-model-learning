<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">模型是条金鱼：每轮把整段历史重发一遍</title>
  <desc id="d">到第10轮时，你的程序要把整段messages原样重放发出去：系统提示词加前面所有轮的对话，再加当前这句。模型是条金鱼读完即忘、无状态、权重冻死。记忆不在模型里，而存在你的程序或数据库，每轮捞出来重新拼进messages，对话连续是重放演出来的。</desc>
  <style>
    .h { font-weight: 700; fill: #1a1a1a; text-anchor: middle; font-size: 18px; }
    .wht { fill: #ffffff; text-anchor: middle; font-weight: 600; }
    .msg { font-size: 11.5px; text-anchor: start; }
    .tag { font-size: 9.5px; text-anchor: middle; font-weight: 700; }
    .sub { fill: #6b7280; font-size: 11px; text-anchor: middle; }
  </style>

  <text x="400" y="30" class="h">模型是条金鱼：每轮把整段历史重发一遍</text>

  <!-- messages 数组 -->
  <rect x="32" y="54" width="318" height="232" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/>
  <rect x="32" y="54" width="318" height="26" rx="8" fill="#374151"/>
  <rect x="32" y="67" width="318" height="13" fill="#374151"/>
  <text x="191" y="72" class="wht" font-size="12.5">第 10 轮发出的 messages（整段重放）</text>

  <rect x="46" y="90" width="290" height="26" rx="4" fill="#e5e7eb"/>
  <text x="56" y="107" class="msg" fill="#374151">system：你是…（人设规则，稳定）</text>

  <rect x="46" y="120" width="226" height="24" rx="4" fill="#dbeafe"/>
  <text x="56" y="136" class="msg" fill="#1e40af">user：我叫老朱</text>
  <rect x="278" y="120" width="58" height="24" rx="4" fill="#bfdbfe"/>
  <text x="307" y="136" class="tag" fill="#1e40af">重放</text>

  <rect x="46" y="148" width="226" height="24" rx="4" fill="#dcfce7"/>
  <text x="56" y="164" class="msg" fill="#166534">assistant：你好老朱</text>
  <rect x="278" y="148" width="58" height="24" rx="4" fill="#bbf7d0"/>
  <text x="307" y="164" class="tag" fill="#166534">重放</text>

  <text x="191" y="190" class="sub" font-style="italic">… 中间 8 轮，全部重放 …</text>

  <rect x="46" y="200" width="226" height="26" rx="4" fill="#fde68a"/>
  <text x="56" y="217" class="msg" fill="#92400e" font-weight="700">user：我叫啥来着？</text>
  <rect x="278" y="200" width="58" height="26" rx="4" fill="#fcd34d"/>
  <text x="307" y="217" class="tag" fill="#92400e">当前</text>

  <text x="191" y="252" class="sub" fill="#b91c1c" font-weight="700">每轮都得把上面整段重发一遍</text>
  <text x="191" y="270" class="sub">（越聊越长 → 撞两堵墙）</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>

  <!-- 箭头 → 金鱼 -->
  <line x1="352" y1="168" x2="404" y2="168" stroke="#374151" stroke-width="2.2" marker-end="url(#ar2)"/>
  <text x="378" y="160" class="sub" font-size="10">发送</text>

  <!-- 金鱼模型 -->
  <rect x="414" y="108" width="196" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="512" y="150" text-anchor="middle" font-size="34">🐟</text>
  <text x="512" y="180" text-anchor="middle" fill="#075985" font-weight="700" font-size="14">金鱼模型</text>
  <text x="512" y="200" class="sub" fill="#0369a1">读完即忘 · 无状态</text>
  <text x="512" y="216" class="sub" fill="#0369a1">（权重冻死，自己不记事）</text>

  <!-- 箭头 → 输出 -->
  <line x1="610" y1="168" x2="648" y2="168" stroke="#374151" stroke-width="2.2" marker-end="url(#ar2)"/>
  <rect x="652" y="142" width="120" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="712" y="164" class="sub" fill="#4338ca" font-weight="700">回答</text>
  <text x="712" y="182" class="sub" fill="#4338ca">“你叫老朱”</text>

  <!-- 底部：记忆活在你这侧 -->
  <rect x="32" y="306" width="740" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <!-- db cylinder -->
  <g transform="translate(70,322)">
    <ellipse cx="22" cy="6" rx="22" ry="7" fill="#bbf7d0" stroke="#16a34a"/>
    <path d="M0 6 V36 A22 7 0 0 0 44 36 V6" fill="#dcfce7" stroke="#16a34a"/>
    <ellipse cx="22" cy="6" rx="22" ry="7" fill="#bbf7d0" stroke="#16a34a"/>
  </g>
  <text x="142" y="334" text-anchor="start" fill="#166534" font-weight="700" font-size="13">“记忆”不在模型里 —— 它存在你的程序 / 数据库</text>
  <text x="142" y="356" text-anchor="start" fill="#166534" font-size="12">每轮由你捞出来、重新拼进 messages。对话的连续，是“重放”演出来的幻觉。</text>
</svg>
