<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">agent loop 骨架：把单圈 chat() 套进 while 循环</title>
  <desc id="d">用户输入进 messages，调用 provider.chat(messages, tools) 拿回 reply；判断 reply.toolCalls.length 是否大于 0：等于 0 就 return reply.text 收工，大于 0 就按名字找到 Tool 执行 execute(args)、把结果作为 tool 消息塞回 messages，再回到 chat 转下一轮。循环条件看 toolCalls.length 而非 stopReason 字符串。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">agent loop 骨架：把单圈 chat() 套进 while</text>
  <text x="420" y="56" text-anchor="middle" font-size="13.5" fill="#475569">循环停不停，看模型这轮吐不吐工具请求</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#64748b"/></marker>
  </defs>

  <!-- 用户输入 -->
  <rect x="52" y="94" width="196" height="48" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">用户输入</text>
  <text x="150" y="133" text-anchor="middle" font-size="11" font-family="'SF Mono', Menlo, monospace" fill="#475569">messages[0]</text>

  <!-- chat 调用 -->
  <rect x="318" y="90" width="286" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="461" y="115" text-anchor="middle" font-size="13" font-weight="700" font-family="'SF Mono', Menlo, monospace" fill="#92400e">provider.chat(messages, tools)</text>
  <text x="461" y="136" text-anchor="middle" font-size="11" fill="#92400e">会抖的模型调用（实战01 的芯片）</text>

  <!-- 决策 -->
  <rect x="346" y="198" width="230" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="461" y="223" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">reply.toolCalls.length &gt; 0 ?</text>
  <text x="461" y="240" text-anchor="middle" font-size="10.5" fill="#64748b">循环条件——不比 stopReason 字符串</text>

  <!-- 收工分支 -->
  <rect x="638" y="200" width="166" height="48" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="721" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">return reply.text</text>
  <text x="721" y="239" text-anchor="middle" font-size="11" fill="#15803d">✓ 模型说完了，收工</text>

  <!-- 执行工具 -->
  <rect x="318" y="298" width="286" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="461" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">按名字找 Tool → execute(args)</text>

  <!-- 塞回 -->
  <rect x="318" y="366" width="286" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="461" y="394" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">结果作为 tool 消息塞回 messages</text>

  <!-- 箭头：用户→chat -->
  <line x1="248" y1="118" x2="312" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <!-- chat→决策 -->
  <line x1="461" y1="150" x2="461" y2="194" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <!-- 决策→收工 -->
  <line x1="576" y1="224" x2="632" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="604" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">否 (=0)</text>
  <!-- 决策→执行 -->
  <line x1="461" y1="250" x2="461" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="497" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">是 (&gt;0)</text>
  <!-- 执行→塞回 -->
  <line x1="461" y1="344" x2="461" y2="362" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <!-- 塞回→chat 回环 -->
  <path d="M318,389 C 250,389 250,120 312,120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="242" y="258" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">下一轮</text>
  <text x="242" y="274" text-anchor="middle" font-size="10.5" fill="#64748b">while</text>

  <!-- 底部说明 -->
  <rect x="52" y="440" width="752" height="46" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="428" y="461" text-anchor="middle" font-size="11.5" fill="#92400e">循环条件 = reply.toolCalls.length（GLM 端是 tool_calls，直接 switch('tool_use') 会漏判）</text>
  <text x="428" y="478" text-anchor="middle" font-size="11" fill="#b45309">恰是真源码 query.ts §554 的做法：不信 stop_reason，靠累积的 tool_use 块判断</text>
</svg>
