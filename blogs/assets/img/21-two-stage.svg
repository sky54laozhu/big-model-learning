<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">两段式检索：召回（双塔）+ 精排（交叉编码）</title>
  <desc id="d">RAG 检索是两段式。上方流水线：全库几十万段，先经召回阶段（双塔 bi-encoder，快但糙）粗筛出约50段候选，再经精排阶段（交叉编码 cross-encoder，慢但准）逐段打分排序，取 top-3 喂给模型。下方对比两种编码方式：左边召回用的双塔，把问题和资料各自单独过编码器染成一支箭再比夹角，资料的箭离线就算好所以快，但两者从没在同一次前向里碰面所以糙；右边精排用的交叉编码，把问题和资料拼成一条喂进同一个 transformer，token 之间交叉 attention 直接输出相关度分，准得多，但每一对都要现算所以贵，只能用在召回剩下的少数候选上。</desc>
  <style>
    .h { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .bx { font-size: 12px; text-anchor: middle; fill: #1f2937; }
    .sub { font-size: 10px; text-anchor: middle; fill: #6b7280; }
    .ph { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .cap { font-size: 11px; text-anchor: middle; fill: #374151; }
    .tag { font-size: 10.5px; text-anchor: middle; }
  </style>

  <text x="40" y="30" class="h">两段式检索：召回撒大网保不漏，精排排座次保准</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
  </defs>

  <!-- ===== 顶部流水线 ===== -->
  <!-- 全库 cylinder -->
  <path d="M44 64 a40 8 0 0 1 80 0 v30 a40 8 0 0 1 -80 0 z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <ellipse cx="84" cy="64" rx="40" ry="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="84" y="86" class="bx" font-size="11">全库·几十万段</text>
  <path d="M126 79 L158 79" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 召回框 -->
  <rect x="160" y="58" width="150" height="44" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="235" y="78" class="ph" fill="#1e3a8a">召回 · 双塔</text>
  <text x="235" y="94" class="sub" fill="#1e40af">快 · 糙 · 保不漏</text>
  <path d="M312 79 L344 79" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 候选池 -->
  <rect x="346" y="62" width="96" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="394" y="84" class="bx" font-size="11" fill="#1e40af">候选 ~50 段</text>
  <path d="M444 79 L476 79" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 精排框 -->
  <rect x="478" y="58" width="170" height="44" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="563" y="78" class="ph" fill="#92400e">精排 · 交叉编码</text>
  <text x="563" y="94" class="sub" fill="#b45309">慢 · 准 · 排座次</text>
  <path d="M650 79 L682 79" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- top-3 -->
  <rect x="684" y="62" width="80" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="724" y="84" class="bx" font-size="11" fill="#166534">top-3</text>
  <path d="M766 79 L798 79" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="838" y="83" class="bx" font-size="11" font-weight="700" fill="#166534">喂模型</text>

  <!-- 分隔 -->
  <line x1="40" y1="126" x2="860" y2="126" stroke="#e5e7eb" stroke-width="1"/>
  <text x="450" y="148" class="cap" font-weight="700" fill="#374151">为什么一个快一个准？因为编码方式根本不同 ——</text>

  <!-- ===== 左面板：双塔 bi-encoder ===== -->
  <rect x="40" y="166" width="400" height="278" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="240" y="190" class="ph" fill="#1e3a8a">召回用 · 双塔（bi-encoder）</text>

  <!-- 问题塔 -->
  <rect x="78" y="206" width="92" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="124" y="225" class="bx" font-size="11">问题</text>
  <path d="M124 234 L124 252" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="70" y="256" width="108" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="124" y="276" class="bx" font-size="11" fill="#1e40af">编码器</text>
  <path d="M124 288 L124 304" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 资料塔 -->
  <rect x="310" y="206" width="92" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="356" y="225" class="bx" font-size="11">资料</text>
  <path d="M356 234 L356 252" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="302" y="256" width="108" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="356" y="276" class="bx" font-size="11" fill="#1e40af">编码器</text>
  <path d="M356 288 L356 304" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 两支箭比夹角 -->
  <line x1="240" y1="350" x2="240" y2="312" stroke="#d1d5db" stroke-width="1"/>
  <line x1="210" y1="346" x2="304" y2="346" stroke="#d1d5db" stroke-width="1"/>
  <path d="M240 346 L210 314" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
  <path d="M240 346 L286 320" stroke="#7c3aed" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="368" class="cap" fill="#1e40af" font-weight="700">各染各的箭 → 比夹角</text>
  <text x="240" y="404" class="cap">✓ 资料箭离线就算好 → 查询时<tspan font-weight="700">快</tspan></text>
  <text x="240" y="424" class="cap">✗ 问题/资料没碰过面 → <tspan font-weight="700">糙</tspan></text>

  <!-- ===== 右面板：交叉编码 cross-encoder ===== -->
  <rect x="460" y="166" width="400" height="278" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="660" y="190" class="ph" fill="#92400e">精排用 · 交叉编码（cross-encoder）</text>

  <rect x="520" y="206" width="280" height="32" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="660" y="227" class="bx" font-size="12" fill="#92400e">「问题 ＋ 资料」拼成一条</text>
  <path d="M660 238 L660 256" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="556" y="260" width="208" height="34" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="660" y="281" class="bx" font-size="11.5" fill="#92400e">同一个 transformer</text>
  <!-- 交叉 attention 小示意 -->
  <path d="M610 297 Q635 312 660 300" stroke="#b45309" stroke-width="1.1" fill="none" opacity="0.7"/>
  <path d="M710 297 Q685 312 660 300" stroke="#b45309" stroke-width="1.1" fill="none" opacity="0.7"/>
  <path d="M660 296 L660 312" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="578" y="316" width="164" height="32" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="660" y="337" class="bx" font-size="11.5" fill="#166534">相关度分 0.92</text>

  <text x="660" y="404" class="cap">✗ 每个〈问,资料〉对都现算 → <tspan font-weight="700">贵</tspan></text>
  <text x="660" y="424" class="cap">✓ token 交叉 attention → <tspan font-weight="700">准</tspan></text>
</svg>
