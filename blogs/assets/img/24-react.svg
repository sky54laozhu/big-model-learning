<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">ReAct：走一步看一步，而不是一次排好全程</title>
  <desc id="d">左边是行不通的一次排 30 步：计划写死成一串步骤，第 3 步跑测试遇到没预料的报错，后面 27 步全盘作废。右边是真实 agent 的走一步看一步，即 ReAct 循环：观察、推理、行动、再观察，每一步决策都吃上一步刚长出来的新结果。</desc>
  <style>
    .h   { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .col { font-weight: 700; font-size: 14px; }
    .step{ font-size: 12.5px; fill: #334155; }
    .dim { font-size: 12.5px; fill: #9ca3af; }
    .nd  { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .cap { font-size: 11.5px; text-anchor: middle; fill: #6b7280; }
  </style>

  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/></marker>
  </defs>

  <text x="40" y="34" class="h">规划：一次排 30 步（✗）  vs  走一步看一步 · ReAct（✓）</text>

  <line x1="440" y1="70" x2="440" y2="440" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- LEFT: 一次排 30 步 -->
  <text x="60" y="96" class="col" fill="#b91c1c">✗ 一次排好全程</text>

  <rect x="60" y="116" width="320" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="78" y="139" class="step">第 1 步　read_file("a.py")</text>

  <rect x="60" y="160" width="320" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="78" y="183" class="step">第 2 步　edit b.py</text>

  <rect x="60" y="204" width="320" height="36" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="78" y="227" class="step" fill="#b91c1c">第 3 步　run_test　✗ 没料到的报错</text>

  <rect x="60" y="248" width="320" height="32" rx="7" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="78" y="269" class="dim">第 4 步　……（基于第 3 步，已失效）</text>

  <rect x="60" y="288" width="320" height="32" rx="7" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="78" y="309" class="dim">第 30 步 ……（全盘作废）</text>

  <text x="220" y="356" class="cap" fill="#b91c1c">报错在跑之前根本不存在 →</text>
  <text x="220" y="374" class="cap" fill="#b91c1c">提前排好的后续步骤全部作废</text>

  <!-- RIGHT: ReAct loop -->
  <text x="470" y="96" class="col" fill="#166534">✓ 走一步看一步 · ReAct</text>

  <!-- three nodes -->
  <circle cx="655" cy="160" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="655" y="165" class="nd" fill="#1e40af">观察</text>

  <circle cx="560" cy="305" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="310" class="nd" fill="#92400e">推理</text>

  <circle cx="755" cy="305" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="755" y="310" class="nd" fill="#166534">行动</text>

  <!-- arrows clockwise: 观察 -> 推理 -> 行动 -> 观察 -->
  <path d="M620 188 L595 277" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar2)"/>
  <path d="M600 318 L715 318" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar2)"/>
  <path d="M748 266 L690 192" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="712" y="232" font-size="11" fill="#16a34a" font-weight="700">新结果</text>

  <text x="655" y="392" class="cap">每一圈都基于上一步</text>
  <text x="655" y="410" class="cap">刚长出来的新结果，再决定下一步</text>
</svg>
