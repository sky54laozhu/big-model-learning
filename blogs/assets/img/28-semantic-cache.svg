<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">语义缓存：拿正确性换省钱的一颗旋钮</title>
  <desc id="d">请求先走 L1 精确层 hash 查表，零误判命中即返回；miss 后落到 L2 语义层，query 染成向量做余弦相似度检索。L2 里有一颗相似度阈值旋钮，往高拧安全但命中少省钱少，往低拧命中多省钱多但易端错。下方小坐标图两条随阈值下降的曲线命中率和错误命中率，拿第22篇黄金集扫阈值定这个点。右侧红色卡片是反义句坑：我要退款对比我不要退款，主题相同向量很近余弦高，命中错答案，比 miss 严重得多，省钱省出无声事故。</desc>
  <style>
    .h  { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .bx { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .sub{ font-size: 11px; fill: #6b7280; }
    .lbl{ font-weight: 700; font-size: 11.5px; }
    .warn{ font-weight: 700; font-size: 12.5px; fill: #b91c1c; }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="34" y="32" class="h">语义缓存：拿正确性换省钱的一颗旋钮</text>

  <!-- flow row -->
  <rect x="34" y="58" width="90" height="52" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="79" y="89" class="bx" fill="#1a1a1a">请求</text>

  <line x1="124" y1="84" x2="160" y2="84" stroke="#64748b" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="162" y="58" width="230" height="52" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="277" y="82" class="bx" fill="#166534">L1 精确层：hash(字符串)</text>
  <text x="277" y="100" class="sub" text-anchor="middle">零误判 · 命中即返回（快车道）</text>

  <text x="420" y="80" class="lbl" fill="#b45309">miss</text>
  <line x1="392" y1="84" x2="470" y2="84" stroke="#64748b" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="472" y="58" width="290" height="52" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="617" y="82" class="bx" fill="#1e40af">L2 语义层：染向量 → 余弦检索</text>
  <text x="617" y="100" class="sub" text-anchor="middle">意思够近就命中（省钱大头，风险也全在这）</text>

  <!-- knob block (left-bottom) -->
  <rect x="34" y="140" width="470" height="238" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="166" class="lbl" fill="#1e40af">L2 的旋钮 = 相似度阈值</text>

  <!-- knob dial -->
  <circle cx="140" cy="240" r="46" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="140" y1="240" x2="172" y2="212" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
  <text x="140" y="304" class="bx" fill="#1e40af">阈值</text>

  <rect x="212" y="188" width="278" height="40" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="224" y="205" class="lbl" fill="#166534">往高拧（很像才命中）</text>
  <text x="224" y="222" class="sub">误判少、安全 —— 但命中少、省钱少</text>

  <rect x="212" y="236" width="278" height="40" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="224" y="253" class="lbl" fill="#b91c1c">往低拧（差不多就命中）</text>
  <text x="224" y="270" class="sub">命中多、省钱多 —— 但越容易端错答案</text>

  <!-- mini chart -->
  <line x1="60" y1="352" x2="470" y2="352" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="300" class="sub">↑ 比率</text>
  <path d="M70,312 C170,318 320,344 468,352" fill="none" stroke="#166534" stroke-width="2"/>
  <path d="M70,346 C180,338 330,320 468,314" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="150" y="330" class="sub" fill="#166534">命中率（省多少）</text>
  <text x="300" y="336" class="sub" fill="#b91c1c">错误命中率（闯多少祸）</text>
  <text x="60" y="370" class="sub">阈值低 → 高 ｜ 拿第 22 篇黄金集扫阈值，定「祸压到红线下、命中还尽量高」那点</text>

  <!-- warn card (right) -->
  <rect x="520" y="140" width="346" height="238" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="540" y="166" class="warn">⚠ 反义句坑（回扣 19 / 22）</text>
  <rect x="540" y="180" width="140" height="38" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.1"/>
  <text x="610" y="204" class="bx" fill="#b91c1c">「我要退款」</text>
  <rect x="706" y="180" width="140" height="38" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.1"/>
  <text x="776" y="204" class="bx" fill="#b91c1c">「我不要退款」</text>
  <text x="540" y="240" class="sub">主题「退款」把向量拽到一块，「不」字扛不过 —— 余弦很高。</text>
  <text x="540" y="262" class="lbl" fill="#b91c1c">语义缓存把 A 的答案端给了 B。</text>
  <text x="540" y="292" class="sub">比 miss 严重得多：</text>
  <text x="540" y="312" class="sub">· miss 只白花钱，答案还是对的</text>
  <text x="540" y="332" class="sub">· 端错 = 自信的错答案，还省了钱</text>
  <text x="540" y="356" class="warn">= 省钱省出一场无声事故</text>
</svg>
