  <rect x="40" y="284" width="360" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.2"/>
  <text x="220" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">anthropic.ts</text>
  <rect x="54" y="316" width="332" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="220" y="336" text-anchor="middle" font-size="9.3" fill="#64748b">runOnce()：fetch + SSE 解析</text>
  <text x="220" y="352" text-anchor="middle" font-size="9.3" fill="#64748b">（跟实战08 一模一样，不变）</text>
  <rect x="54" y="372" width="332" height="26" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="220" y="390" text-anchor="middle" font-size="8.8" fill="#92400e">message_start → inputTokens ← 新增</text>
  <rect x="54" y="404" width="332" height="26" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="220" y="422" text-anchor="middle" font-size="8.8" fill="#92400e">message_delta → 累计 outputTokens ← 新增</text>
  <text x="220" y="450" text-anchor="middle" font-size="8.3" fill="#a16207">outputTokens 是"跑到目前为止的累计</text>
  <text x="220" y="463" text-anchor="middle" font-size="8.3" fill="#a16207">总数"，不是增量，最后一次收到的就是终值</text>

  <!-- openai.ts -->
  <rect x="440" y="284" width="360" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.2"/>
  <text x="620" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">openai.ts（结构相同）</text>
  <rect x="454" y="316" width="332" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="620" y="336" text-anchor="middle" font-size="9.3" fill="#64748b">runOnce()：fetch + tool_calls[].index</text>
  <text x="620" y="352" text-anchor="middle" font-size="9.3" fill="#64748b">累积（跟实战08 一模一样，不变）</text>
  <rect x="454" y="372" width="332" height="26" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="620" y="390" text-anchor="middle" font-size="8.8" fill="#92400e">stream_options:{include_usage:true} ← 新增</text>
  <rect x="454" y="404" width="332" height="26" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="620" y="422" text-anchor="middle" font-size="8.8" fill="#92400e">末尾空 choices 的 chunk.usage → Usage ← 新增</text>
  <text x="620" y="450" text-anchor="middle" font-size="8.3" fill="#a16207">两种协议账本形状完全不同，抠出来后</text>
  <text x="620" y="463" text-anchor="middle" font-size="8.3" fill="#a16207">统一成同一个 Usage 形状交给 loop.ts</text>

  <!-- 箭头：providers → loop.ts -->
  <line x1="220" y1="474" x2="220" y2="496" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="220,500 214,488 226,488" fill="#94a3b8"/>
  <line x1="620" y1="474" x2="620" y2="496" stroke="#94a3b8" stroke-width="2"/>
