<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">LLM 网关分层解剖</title>
  <desc id="d">网关内部三层：最上协议转换层（LLM 独有 10%，统一 schema 进、各家方言出）；中间控制流层（智能路由/级联/failover，Own Your Control Flow）；最下横切治理层（老朋友 90%，认证/限流/密钥/日志算账）。左侧入口是只说统一格式的业务代码，右侧连出三家厂商。右下角边界卡片点明网关控制流（基础设施层）与 agent loop 控制流（应用层）是不同粒度。</desc>
  <style>
    .h  { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .bx { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .bs { font-size: 11px; text-anchor: middle; }
    .lyr{ font-weight: 700; font-size: 14px; }
    .badge{ font-weight: 700; font-size: 11px; text-anchor: end; }
    .lb { font-size: 11.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
  </defs>

  <text x="34" y="32" class="h">LLM 网关拆开：三层各管一摊</text>

  <!-- business entry -->
  <rect x="26" y="182" width="120" height="80" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="86" y="212" class="bx" fill="#334155">业务代码</text>
  <text x="86" y="232" class="bs" fill="#64748b">只说统一格式</text>
  <text x="86" y="249" class="bs" fill="#64748b">model: "auto"</text>
  <line x1="148" y1="222" x2="182" y2="222" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- gateway outer -->
  <rect x="186" y="70" width="446" height="292" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="409" y="92" class="bx" fill="#334155" font-size="14">LLM 网关</text>

  <!-- layer 1: protocol conversion -->
  <rect x="202" y="104" width="414" height="76" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="218" y="130" class="lyr" fill="#5b21b6">① 协议转换层</text>
  <text x="600" y="126" class="badge" fill="#7c3aed">LLM 独有 10%</text>
  <text x="218" y="152" class="lb" fill="#5b21b6">统一 schema 进 → 各家方言出</text>
  <text x="218" y="170" class="lb" fill="#5b21b6">屏蔽 messages / chat.completions / tool_use vs tool_calls 差异</text>

  <!-- layer 2: control flow -->
  <rect x="202" y="188" width="414" height="76" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="218" y="214" class="lyr" fill="#92400e">② 控制流层</text>
  <text x="600" y="210" class="badge" fill="#b45309">Own Your Control Flow</text>
  <text x="218" y="236" class="lb" fill="#92400e">智能路由（挑模型）· 级联升级 · failover 切备用</text>
  <text x="218" y="254" class="lb" fill="#92400e">「该调哪个模型、失败怎么办」攥在你手里（第 26 篇住这儿）</text>

  <!-- layer 3: cross-cutting governance -->
  <rect x="202" y="272" width="414" height="76" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="218" y="298" class="lyr" fill="#1e40af">③ 横切治理层</text>
  <text x="600" y="294" class="badge" fill="#2563eb">老朋友 90%</text>
  <text x="218" y="320" class="lb" fill="#1e40af">认证鉴权 · 限流配额 · 密钥收口 · 日志监控 / 算账</text>
  <text x="218" y="338" class="lb" fill="#1e40af">全是 API Gateway 经验直接平移</text>

  <!-- providers -->
  <rect x="676" y="112" width="98" height="44" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="725" y="139" class="bx" fill="#475569">Anthropic</text>
  <rect x="676" y="194" width="98" height="44" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="725" y="221" class="bx" fill="#475569">OpenAI</text>
  <rect x="676" y="276" width="98" height="44" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="725" y="303" class="bx" fill="#475569">GLM</text>
  <line x1="634" y1="142" x2="674" y2="134" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="634" y1="216" x2="674" y2="216" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="634" y1="290" x2="674" y2="298" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- boundary card -->
  <rect x="26" y="392" width="848" height="70" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="42" y="416" class="lyr" fill="#9a3412" font-size="13">⚠ 两层控制流，别混：粒度不同，谁也不越界</text>
  <text x="42" y="440" class="lb" fill="#9a3412">网关控制流 = 基础设施层，跨请求 / 跨团队：这个 query 派给哪个厂商 / 模型</text>
  <text x="470" y="440" class="lb" fill="#9a3412">agent loop 控制流（第 24 篇）= 应用层，单任务内：这一步该不该再调工具</text>
</svg>
