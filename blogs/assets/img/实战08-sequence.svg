<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">序列图：两次 502 之后第三次成功——withRetry 对调用方完全透明</title>
  <desc id="d">三条生命线：loop.ts（消费事件）、withRetry（重试节奏）、runOnce+fetch（模型 API）。第①拍：loop.ts 调 provider.streamChat()，实际是 yield* withRetry(runOnce)；withRetry 发起 attempt 1，调 runOnce，runOnce fetch 到 502，抛出 HttpError(502, upstream overloaded)。第②拍：withRetry 判断 isRetryable(502)=true 且 attempt(1)≤MAX_RETRIES(3)，算出 delayMs=1000ms，yield 一个 retry 事件传给 loop.ts；loop.ts 打印警告行并清空 text/toolCalls。第③拍：withRetry await sleep(1000ms)。第④拍：attempt 2，同样的过程再来一遍——fetch 502，throw，yield retry(2/3,2000ms)，loop.ts 打印+清空，withRetry sleep(2000ms)。第⑤拍：attempt 3，runOnce fetch 到 200 和一份 SSE 流，yield text_delta('重试后活了')，withRetry 用 yield* 原样透传给 loop.ts，loop.ts 累积 text 并写 stdout。第⑥拍：runOnce yield done('end_turn')，同样透传；runOnce 的生成器正常结束，withRetry 里的 yield* runOnce() 返回，触发 return，不再进入下一轮 attempt。第⑦拍：loop.ts 发现 toolCalls 为空，return text，这一轮收工。底部结论：withRetry 对调用方完全透明——失败时多吐几个 retry 事件，成功时原样转发 runOnce 的事件，loop.ts 消费的接口跟没有重试机制时一模一样，都只是消费一个 AsyncGenerator&lt;StreamEvent&gt;。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">序列图：两次 502 之后第三次成功</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#475569">withRetry 对调用方完全透明——失败多吐几个 retry 事件，成功原样透传，loop.ts 消费的接口没变过</text>

  <!-- 三条生命线 -->
  <rect x="60" y="70" width="190" height="34" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="155" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">loop.ts（消费事件）</text>
  <line x1="155" y1="104" x2="155" y2="650" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>

  <rect x="365" y="70" width="170" height="34" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="2.2"/>
  <text x="450" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">withRetry（重试节奏）</text>
  <line x1="450" y1="104" x2="450" y2="650" stroke="#d4a15a" stroke-width="1.6" stroke-dasharray="4 4"/>

  <rect x="650" y="70" width="200" height="34" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="750" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">runOnce + fetch（模型 API）</text>
  <line x1="750" y1="104" x2="750" y2="650" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- 第①拍 -->
  <text x="16" y="128" font-size="11" font-weight="700" fill="#1e293b">①</text>
  <line x1="155" y1="122" x2="450" y2="122" stroke="#475569" stroke-width="1.6"/>
  <polygon points="450,122 438,117 438,127" fill="#475569"/>
  <text x="300" y="116" text-anchor="middle" font-size="9" fill="#475569">yield* withRetry(runOnce)</text>
  <line x1="450" y1="136" x2="750" y2="136" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="750,136 738,131 738,141" fill="#b45309"/>
  <text x="600" y="130" text-anchor="middle" font-size="9" fill="#92400e">attempt 1：yield* runOnce()</text>
  <rect x="662" y="144" width="176" height="24" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="750" y="160" text-anchor="middle" font-size="8.6" fill="#b91c1c">fetch → 502 upstream overloaded</text>
  <line x1="750" y1="172" x2="450" y2="172" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <polygon points="450,172 462,167 462,177" fill="#b91c1c"/>
  <text x="600" y="184" text-anchor="middle" font-size="8.8" fill="#b91c1c">throw HttpError(502, "upstream overloaded")</text>

  <!-- 第②拍 -->
  <text x="16" y="212" font-size="11" font-weight="700" fill="#1e293b">②</text>
  <rect x="366" y="196" width="168" height="34" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="450" y="209" text-anchor="middle" font-size="8.4" fill="#92400e">isRetryable(502)=true，attempt(1)≤3</text>
  <text x="450" y="222" text-anchor="middle" font-size="8.4" fill="#92400e">delayMs=backoffDelay(1)=1000ms</text>
  <line x1="450" y1="240" x2="155" y2="240" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="155,240 167,235 167,245" fill="#b45309"/>
  <text x="300" y="252" text-anchor="middle" font-size="8.8" fill="#92400e">yield {type:'retry', attempt:1/3, delayMs:1000, reason:'…502…'}</text>
  <rect x="62" y="258" width="186" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="155" y="272" text-anchor="middle" font-size="8.4" fill="#334155">打印 ⚠ 警告行</text>
  <text x="155" y="284" text-anchor="middle" font-size="8.4" fill="#334155">text=''，toolCalls.length=0</text>

  <!-- 第③拍 -->
  <text x="16" y="312" font-size="11" font-weight="700" fill="#1e293b">③</text>
  <rect x="366" y="296" width="168" height="24" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="450" y="312" text-anchor="middle" font-size="8.8" fill="#92400e">await sleep(1000ms) —— 真的等 1 秒</text>

  <!-- 第④拍：attempt 2 压缩 -->
  <text x="16" y="356" font-size="11" font-weight="700" fill="#1e293b">④</text>
  <rect x="366" y="330" width="168" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="450" y="346" text-anchor="middle" font-size="8.6" fill="#475569">attempt 2：同样过程再来一遍</text>
  <text x="450" y="360" text-anchor="middle" font-size="8.4" fill="#475569">fetch→502→throw→retry(2/3,</text>
  <text x="450" y="373" text-anchor="middle" font-size="8.4" fill="#475569">2000ms)→loop.ts 打印+清空→</text>
  <text x="450" y="386" text-anchor="middle" font-size="8.4" fill="#475569">withRetry sleep(2000ms)</text>

  <!-- 第⑤拍 -->
  <text x="16" y="418" font-size="11" font-weight="700" fill="#1e293b">⑤</text>
  <line x1="450" y1="404" x2="750" y2="404" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="750,404 738,399 738,409" fill="#b45309"/>
  <text x="600" y="398" text-anchor="middle" font-size="9" fill="#92400e">attempt 3：yield* runOnce()</text>
  <rect x="662" y="412" width="176" height="24" rx="5" fill="#f0fdf4" stroke="#166534" stroke-width="1.4"/>
  <text x="750" y="428" text-anchor="middle" font-size="8.6" fill="#166534">fetch → 200 + SSE 流</text>
  <line x1="750" y1="440" x2="450" y2="440" stroke="#166534" stroke-width="1.6"/>
  <polygon points="450,440 462,435 462,445" fill="#166534"/>
  <text x="600" y="452" text-anchor="middle" font-size="8.6" fill="#166534">yield text_delta('重试后活了')</text>
  <line x1="450" y1="458" x2="155" y2="458" stroke="#166534" stroke-width="1.6"/>
  <polygon points="155,458 167,453 167,463" fill="#166534"/>
  <text x="300" y="470" text-anchor="middle" font-size="8.6" fill="#166534">yield* 原样透传（withRetry 不拦截）</text>
  <rect x="62" y="476" width="186" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="155" y="492" text-anchor="middle" font-size="8.4" fill="#334155">text += '重试后活了'，写 stdout</text>

  <!-- 第⑥拍 -->
  <text x="16" y="524" font-size="11" font-weight="700" fill="#1e293b">⑥</text>
  <line x1="750" y1="510" x2="450" y2="510" stroke="#475569" stroke-width="1.6"/>
  <polygon points="450,510 462,505 462,515" fill="#475569"/>
  <text x="600" y="522" text-anchor="middle" font-size="8.6" fill="#475569">yield done('end_turn') → 原样透传</text>
  <line x1="450" y1="528" x2="155" y2="528" stroke="#475569" stroke-width="1.6"/>
  <polygon points="155,528 167,523 167,533" fill="#475569"/>
  <rect x="366" y="536" width="168" height="30" rx="5" fill="#f0fdf4" stroke="#166534" stroke-width="1.4"/>
  <text x="450" y="550" text-anchor="middle" font-size="8.4" fill="#166534">runOnce() 正常结束 → yield*</text>
  <text x="450" y="562" text-anchor="middle" font-size="8.4" fill="#166534">runOnce() 返回，触发 return</text>

  <!-- 第⑦拍 -->
  <text x="16" y="596" font-size="11" font-weight="700" fill="#1e293b">⑦</text>
  <rect x="62" y="578" width="186" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="155" y="592" text-anchor="middle" font-size="8.4" fill="#334155">toolCalls 为空 → return text</text>
  <text x="155" y="604" text-anchor="middle" font-size="8.4" fill="#334155">（这一轮收工）</text>

  <!-- 结论 -->
  <rect x="40" y="618" width="820" height="66" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2.2"/>
  <text x="450" y="638" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">withRetry 对调用方（loop.ts）完全透明</text>
  <text x="450" y="656" text-anchor="middle" font-size="10" fill="#475569">失败时多吐几个 retry 事件，成功时原样转发 runOnce 的事件——loop.ts 消费的接口</text>
  <text x="450" y="672" text-anchor="middle" font-size="10" fill="#475569">跟没有重试机制时一模一样，都只是在消费一个 AsyncGenerator&lt;StreamEvent&gt;</text>
</svg>
