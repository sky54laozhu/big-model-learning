<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">类型就是一组允许的值（集合）</title>
  <desc id="d">boolean 是 2 元素集合、byte 是 256 元素集合、string 是无限集合；三个都是集合，只是大小不同。类型注解等于给变量槽围一道栅栏，只放行集合里的值。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="420" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">类型 = 一组允许的值（集合）</text>
  <text x="420" y="64" text-anchor="middle" font-size="13.5" fill="#475569">类型不同，只是允许的值集合大小不同</text>

  <!-- boolean 集合 -->
  <ellipse cx="175" cy="270" rx="120" ry="95" fill="#f0fdf4" stroke="#166534" stroke-width="2.5"/>
  <text x="175" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">boolean</text>
  <circle cx="140" cy="278" r="6" fill="#166534"/>
  <text x="140" y="301" text-anchor="middle" font-size="12.5" fill="#15803d">true</text>
  <circle cx="212" cy="278" r="6" fill="#166534"/>
  <text x="212" y="301" text-anchor="middle" font-size="12.5" fill="#15803d">false</text>
  <text x="175" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">2 个元素（有限）</text>

  <!-- byte 集合 -->
  <ellipse cx="420" cy="270" rx="120" ry="95" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="420" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">byte</text>
  <text x="420" y="282" text-anchor="middle" font-size="14" fill="#2563eb">-128  …  127</text>
  <text x="420" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">256 个（示意 · 非 TS 类型）</text>

  <!-- string 集合 -->
  <ellipse cx="665" cy="270" rx="120" ry="95" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="665" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">string</text>
  <text x="665" y="282" text-anchor="middle" font-size="13" fill="#92400e">""  "a"  "你好"  …</text>
  <text x="665" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">无限个</text>

  <text x="420" y="440" text-anchor="middle" font-size="13.5" fill="#475569">注解 = 围栅栏：只有集合里的值能进这个槽，别的编译期就红线。</text>
</svg>
