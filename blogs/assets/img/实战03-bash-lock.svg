<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">bash 的门 vs 锁：十几行 vs 一万行</title>
  <desc id="d">左侧我们的 bash.ts 是逃生舱的门，用 Bun.spawn 把命令丢进 shell、抓输出，约 15 行逻辑，裸奔无沙箱无黑名单无超时。右侧真源码 BashTool 目录是那把锁，十几个文件逾一万行：bashPermissions 2621 行、bashSecurity 2592、readOnlyValidation 1990、pathValidation 1303、sed 校验解析 1006、其余约 1382。门最不值钱，锁才是难题——判断一条任意命令安不安全是打地鼠，实战04 专门上锁且永远关不严。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">bash 的门十几行，那把锁一万行</text>
  <text x="430" y="58" text-anchor="middle" font-size="13.5" fill="#475569">门（Bun.spawn 那一下）最不值钱，值钱的是门后面没上的锁</text>

  <!-- 左：门 -->
  <text x="196" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">我们的 bash.ts — 逃生舱的门</text>
  <rect x="40" y="104" width="312" height="150" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="60" y="134" font-size="11" font-family="'SF Mono', Menlo, monospace" fill="#475569">Bun.spawn(['bash','-c', cmd])</text>
  <text x="60" y="156" font-size="11" font-family="'SF Mono', Menlo, monospace" fill="#475569">→ 抓 stdout / stderr 返回</text>
  <text x="196" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="#334155">约 15 行逻辑</text>
  <rect x="66" y="212" width="260" height="30" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="196" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">裸奔 · 无沙箱 / 无黑名单 / 无超时</text>

  <!-- 右：锁（条形图） -->
  <text x="606" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">真源码 BashTool/ — 那把锁</text>

  <!-- bars -->
  <text x="396" y="126" font-size="10" font-family="'SF Mono', Menlo, monospace" fill="#334155">bashPermissions</text>
  <rect x="520" y="116" width="282" height="16" rx="3" fill="#fca5a5" stroke="#b91c1c" stroke-width="1"/>
  <text x="808" y="129" text-anchor="start" font-size="9.5" font-weight="700" fill="#7f1d1d">2621</text>

  <text x="396" y="152" font-size="10" font-family="'SF Mono', Menlo, monospace" fill="#334155">bashSecurity</text>
  <rect x="520" y="142" width="279" height="16" rx="3" fill="#fca5a5" stroke="#b91c1c" stroke-width="1"/>
  <text x="805" y="155" text-anchor="start" font-size="9.5" font-weight="700" fill="#7f1d1d">2592</text>

  <text x="396" y="178" font-size="10" font-family="'SF Mono', Menlo, monospace" fill="#334155">readOnlyValidation</text>
  <rect x="520" y="168" width="214" height="16" rx="3" fill="#fca5a5" stroke="#b91c1c" stroke-width="1"/>
  <text x="740" y="181" text-anchor="start" font-size="9.5" font-weight="700" fill="#7f1d1d">1990</text>

  <text x="396" y="204" font-size="10" font-family="'SF Mono', Menlo, monospace" fill="#334155">pathValidation</text>
  <rect x="520" y="194" width="140" height="16" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1"/>
  <text x="666" y="207" text-anchor="start" font-size="9.5" font-weight="700" fill="#7f1d1d">1303</text>

  <text x="396" y="230" font-size="10" font-family="'SF Mono', Menlo, monospace" fill="#334155">sed 校验 / 解析</text>
  <rect x="520" y="220" width="108" height="16" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1"/>
  <text x="634" y="233" text-anchor="start" font-size="9.5" font-weight="700" fill="#7f1d1d">1006</text>

  <text x="396" y="256" font-size="10" font-family="'SF Mono', Menlo, monospace" fill="#334155">其余 9 个文件</text>
  <rect x="520" y="246" width="149" height="16" rx="3" fill="#fed7d7" stroke="#b91c1c" stroke-width="1"/>
  <text x="675" y="259" text-anchor="start" font-size="9.5" font-weight="700" fill="#7f1d1d">1382</text>

  <text x="606" y="292" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">十几个文件 · 逾 1 万行</text>
  <text x="606" y="312" text-anchor="middle" font-size="10" fill="#a16207">仅 .ts，UI 的 .tsx 还没算</text>

  <!-- 分隔 -->
  <line x1="376" y1="104" x2="376" y2="320" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 底部收口 -->
  <rect x="40" y="352" width="780" height="132" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="380" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">一个「跑 shell 命令」的工具，门最不值钱，值钱的全在门后那把锁</text>
  <text x="430" y="408" text-anchor="middle" font-size="12" fill="#b45309">锁的核心难题 = 判断一条任意 shell 命令安不安全</text>
  <text x="430" y="430" text-anchor="middle" font-size="11.5" fill="#a16207">a &amp;&amp; rm -rf b · 变量展开 · 管道到 sh —— 正则根本判不干净</text>
  <rect x="250" y="446" width="360" height="30" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="430" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">实战04 专门上锁 —— 且这锁永远关不严，只能层层设防</text>
</svg>
