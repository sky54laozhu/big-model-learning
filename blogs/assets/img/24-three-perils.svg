<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">自主的三种祸与三道护栏</title>
  <desc id="d">放权给模型自主行动会闯三种祸，harness 各用一道确定性护栏兜住。炸：死循环，模型一直吐 tool_use 永不收工，护栏是最大步数上限 max_iterations，对应柱一约束下设计。坏：不可逆动作如 rm -rf 或群发邮件，执行了就回不去，护栏是危险动作前的人工审批闸门，回扣第 18 篇控制闸门，对应柱三。偏：错误雪球，错判灌回 context 喂给下一步越滚越大，护栏是上下文管理加状态线接住，回扣第 23 篇两条线。</desc>
  <style>
    .h    { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .colh { font-weight: 700; font-size: 13.5px; }
    .lab  { font-weight: 700; font-size: 14px; }
    .det  { font-size: 11.5px; }
  </style>

  <defs>
    <marker id="ar3" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
  </defs>

  <text x="40" y="34" class="h">自主的代价：你放了权，harness 就得用三道护栏兜住三种祸</text>

  <text x="60"  y="74" class="colh" fill="#b91c1c">祸 · 自主性的固有税</text>
  <text x="500" y="74" class="colh" fill="#166534">护栏 · harness 的确定手段</text>

  <!-- Row 1: 炸 -->
  <rect x="60" y="90" width="340" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="124" class="lab" fill="#b91c1c">炸 · 死循环</text>
  <text x="80" y="148" class="det" fill="#991b1b">模型一直吐 tool_use，永不收工</text>
  <line x1="408" y1="130" x2="492" y2="130" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ar3)"/>
  <rect x="500" y="90" width="340" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="124" class="lab" fill="#166534">最大步数上限 max_iterations</text>
  <text x="520" y="148" class="det" fill="#166534">柱一 · 约束下的设计</text>

  <!-- Row 2: 坏 -->
  <rect x="60" y="182" width="340" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="216" class="lab" fill="#b91c1c">坏 · 不可逆动作</text>
  <text x="80" y="240" class="det" fill="#991b1b">rm -rf、群发邮件，执行了就回不去</text>
  <line x1="408" y1="222" x2="492" y2="222" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ar3)"/>
  <rect x="500" y="182" width="340" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="216" class="lab" fill="#166534">危险动作前 · 人工审批闸门</text>
  <text x="520" y="240" class="det" fill="#166534">回扣 18 控制闸门 · 柱三</text>

  <!-- Row 3: 偏 -->
  <rect x="60" y="274" width="340" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="308" class="lab" fill="#b91c1c">偏 · 错误雪球</text>
  <text x="80" y="332" class="det" fill="#991b1b">错判灌回 context，喂下一步越滚越大</text>
  <line x1="408" y1="314" x2="492" y2="314" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ar3)"/>
  <rect x="500" y="274" width="340" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="308" class="lab" fill="#166534">上下文管理 + 状态线接住</text>
  <text x="520" y="332" class="det" fill="#166534">回扣 23 两条线（记忆线 + 状态线）</text>

  <text x="440" y="396" font-size="12" text-anchor="middle" fill="#6b7280">循环放大错误：单次问答错一次就停，while 循环把错误喂进下一步——模型越敢自主，护栏越是命门</text>
</svg>
