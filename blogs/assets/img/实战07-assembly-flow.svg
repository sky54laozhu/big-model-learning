<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">主控制流程图：buildSystemPrompt() 内部装配顺序，以及"动态"到底动态在哪</title>
  <desc id="d">buildSystemPrompt 先放入恒在的静态指令，再按 includeMemory 开关决定要不要读 CLAUDE.md，再按 includeEnvInfo 开关决定要不要拼环境信息和 git 快照。单独关掉某一个开关只是少了那一段内容，不直接等于下文对比实验的版本A或版本B——版本B是两个开关同时关掉，版本A是压根没有 system prompt，靠这两个开关拼不出来（BASE_INSTRUCTIONS 恒在）。git 状态快照有一层进程内缓存：cachedGitStatus 首次为 null 才真正跑 git 三条命令，此后同一进程内的调用直接复用缓存，不重新跑。底部结论：这里的"动态"不是"每轮重算"，是"绑定会话生命周期，随 /clear、/compact 一类事件失效重算"——本章的 harness 一次运行就是一场会话，进程级缓存正好等价于会话级缓存，跟真源码的 memoize 是同一个道理，只是粒度更粗。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">主控制流程：装配顺序，以及"动态"到底动态在哪</text>
  <text x="420" y="58" text-anchor="middle" font-size="13" fill="#475569">静态指令 → CLAUDE.md（可关）→ 环境信息（可关）→ git 快照（进程内缓存）——四段拼一份 system 字符串</text>

  <!-- ① 静态指令 -->
  <rect x="250" y="82" width="340" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">① sections = [BASE_INSTRUCTIONS]</text>
  <text x="420" y="116" text-anchor="middle" font-size="9.5" fill="#64748b">硬编码字符串，跟任何参数/运行时状态零依赖</text>

  <line x1="420" y1="124" x2="420" y2="144" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="420,148 414,136 426,136" fill="#94a3b8"/>

  <!-- ② CLAUDE.md -->
  <rect x="250" y="150" width="340" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="420" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338ca">② includeMemory ? loadMemory(cwd) 读 CLAUDE.md</text>
  <text x="420" y="188" text-anchor="middle" font-size="9.5" fill="#4338ca">try readFile → 不存在/空文件静默跳过，不报错</text>

  <line x1="592" y1="176" x2="626" y2="176" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="630,176 620,171 620,181" fill="#6366f1"/>
  <rect x="632" y="150" width="168" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="716" y="166" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4338ca">关掉 → 少一段项目规则</text>
  <text x="716" y="181" text-anchor="middle" font-size="8" fill="#4338ca">单关这个≠版本B</text>
  <text x="716" y="195" text-anchor="middle" font-size="8" fill="#4338ca">版本B要两个开关都关</text>

  <line x1="420" y1="202" x2="420" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="420,226 414,214 426,214" fill="#94a3b8"/>

  <!-- ③ 环境信息 -->
  <rect x="250" y="228" width="340" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="420" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338ca">③ includeEnvInfo ? 拼 cwd / 平台 / isGitRepo</text>
  <text x="420" y="266" text-anchor="middle" font-size="9.5" fill="#4338ca">isGitRepo = runGit(['rev-parse','--is-inside-work-tree'])</text>

  <line x1="592" y1="254" x2="626" y2="254" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="630,254 620,249 620,259" fill="#6366f1"/>
  <rect x="632" y="228" width="168" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="716" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4338ca">关掉 → 缺环境+git快照</text>
  <text x="716" y="259" text-anchor="middle" font-size="8" fill="#4338ca">版本A是压根没system</text>
  <text x="716" y="273" text-anchor="middle" font-size="8" fill="#4338ca">这俩开关拼不出版本A</text>

  <line x1="420" y1="280" x2="420" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="420,304 414,292 426,292" fill="#94a3b8"/>

  <!-- ④ isGitRepo 分支 -->
  <rect x="250" y="306" width="340" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="420" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">④ isGitRepo？否则不拼 git 状态这一段</text>

  <line x1="420" y1="344" x2="420" y2="364" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="420,368 414,356 426,356" fill="#94a3b8"/>

  <!-- 缓存判断：折叠点⑦核心 -->
  <rect x="200" y="374" width="440" height="46" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="2.4"/>
  <text x="420" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">⑤ cachedGitStatus === null ？（进程内只判一次）</text>
  <text x="420" y="410" text-anchor="middle" font-size="9.5" fill="#92400e">这一步，正是折叠点⑦"动态≠每轮重算"的落地代码</text>

  <line x1="330" y1="420" x2="280" y2="450" stroke="#b45309" stroke-width="2"/>
  <polygon points="266,458 280,447 288,458" fill="#b45309"/>
  <line x1="510" y1="420" x2="560" y2="450" stroke="#166534" stroke-width="2"/>
  <polygon points="574,458 552,451 560,462" fill="#166534"/>

  <rect x="90" y="460" width="290" height="70" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="235" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">是（首次 / cache miss）</text>
  <text x="235" y="498" text-anchor="middle" font-size="9.5" fill="#7f1d1d">computeGitStatus()：并行跑</text>
  <text x="235" y="514" text-anchor="middle" font-size="9.5" fill="#7f1d1d">branch / status / log 三条 git 命令</text>

  <rect x="470" y="460" width="290" height="70" rx="9" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="615" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">否（同进程内已算过 / cache hit）</text>
  <text x="615" y="498" text-anchor="middle" font-size="9.5" fill="#166534">直接复用 cachedGitStatus</text>
  <text x="615" y="514" text-anchor="middle" font-size="9.5" fill="#166534">不重新跑 git，不重新拼快照文案</text>

  <line x1="235" y1="530" x2="235" y2="548" stroke="#b91c1c" stroke-width="1.8"/>
  <line x1="615" y1="530" x2="615" y2="548" stroke="#166534" stroke-width="1.8"/>
  <line x1="235" y1="548" x2="615" y2="548" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="420" y1="548" x2="420" y2="566" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="420,570 414,558 426,558" fill="#94a3b8"/>

  <!-- ⑥ 返回 -->
  <rect x="250" y="576" width="340" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="420" y="599" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">⑥ sections.join('\n\n') → 返回一份 system 字符串</text>

  <!-- 底部结论 -->
  <rect x="40" y="626" width="760" height="62" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="648" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">"动态"≠"每轮重算"，是"绑定会话生命周期，随 /clear、/compact 一类事件才失效重算"</text>
  <text x="420" y="668" text-anchor="middle" font-size="10.5" fill="#a16207">本章 harness 一次运行＝一场会话，进程级缓存刚好等价于会话级缓存——跟真源码的 memoize 同一个道理，粒度更粗（回扣折叠点⑦）</text>
</svg>
