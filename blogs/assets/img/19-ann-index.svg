<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">ANN 近似最近邻索引的两种主流思路</title>
  <desc id="d">在上亿支箭里找最近的箭，不能逐个比，要建ANN近似索引，主流两种思路。思路A聚类分桶IVF：离线把所有箭聚成多个区，每区一个中心点；查询时先拿问句只跟少数中心点比（粗筛），找到最近的区，再只在那几个区里逐个精挑。1亿次点积砍到几十万次。思路B邻居图HNSW：每支箭事先连上近邻织成网，分层，顶层稀疏连线远用来大步跨越，底层密集用来精挑；查询从一点出发每步朝离问句更近的邻居跳，像导航先上高速再进小巷。两种都用近似换速度。</desc>
  <style>
    .h { font-weight: 700; fill: #1a1a1a; text-anchor: middle; font-size: 18px; }
    .ht { font-weight: 700; font-size: 14px; text-anchor: middle; }
    .body { font-size: 11.5px; text-anchor: middle; }
    .sub { fill: #6b7280; font-size: 10.5px; text-anchor: middle; }
    .lab { font-size: 11px; text-anchor: middle; font-weight: 700; }
  </style>

  <text x="440" y="30" class="h">ANN 索引：上亿支箭里，怎么不逐个比</text>
  <text x="440" y="52" class="sub">主动放弃"绝对最近"，用一点精度换几个数量级速度（工程问"够好"）</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#dc2626"/></marker>
  </defs>

  <!-- 左：思路A 聚类分桶 -->
  <rect x="28" y="74" width="396" height="356" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="226" y="98" class="ht" fill="#92400e">思路 A · 先聚类分桶（IVF）</text>

  <!-- 三个区 -->
  <circle cx="120" cy="190" r="58" fill="#fef9c3" stroke="#eab308" stroke-width="1.3"/>
  <circle cx="320" cy="170" r="50" fill="#fef9c3" stroke="#eab308" stroke-width="1.3"/>
  <circle cx="230" cy="300" r="62" fill="#fef9c3" stroke="#eab308" stroke-width="1.3"/>
  <!-- 散点 -->
  <g fill="#a16207">
    <circle cx="100" cy="175" r="3"/><circle cx="135" cy="200" r="3"/><circle cx="112" cy="210" r="3"/><circle cx="140" cy="170" r="3"/><circle cx="95" cy="200" r="3"/>
    <circle cx="310" cy="158" r="3"/><circle cx="335" cy="180" r="3"/><circle cx="300" cy="185" r="3"/><circle cx="330" cy="155" r="3"/>
    <circle cx="215" cy="290" r="3"/><circle cx="250" cy="312" r="3"/><circle cx="225" cy="320" r="3"/><circle cx="245" cy="282" r="3"/><circle cx="205" cy="310" r="3"/>
  </g>
  <!-- 中心点 -->
  <g fill="#b45309" stroke="#92400e" stroke-width="1">
    <rect x="114" y="184" width="12" height="12" rx="2"/>
    <rect x="314" y="164" width="12" height="12" rx="2"/>
    <rect x="224" y="294" width="12" height="12" rx="2"/>
  </g>
  <text x="120" y="252" class="sub" fill="#92400e">区中心</text>

  <!-- 查询点 -->
  <circle cx="350" cy="285" r="5" fill="#dc2626"/>
  <text x="350" y="270" class="sub" fill="#b91c1c" font-weight="700">问句</text>
  <!-- 粗筛箭：问句→只比中心点 -->
  <path d="M345 282 L240 300" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>

  <text x="226" y="378" class="body" fill="#92400e">① 只跟少数"区中心"比 → 锁定最近的区</text>
  <text x="226" y="398" class="body" fill="#92400e">② 只在那个区里逐个精挑</text>
  <text x="226" y="418" class="sub" fill="#a16207">1 亿次点积 → 几十万次（砍掉 99.5%）</text>

  <!-- 右：思路B 邻居图 HNSW -->
  <rect x="456" y="74" width="396" height="356" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="654" y="98" class="ht" fill="#1e40af">思路 B · 邻居图上贪心跳（HNSW）</text>

  <!-- 顶层稀疏（长链） -->
  <text x="540" y="128" class="sub" fill="#1e40af">顶层稀疏：大步跨越</text>
  <g stroke="#93c5fd" stroke-width="1.2">
    <line x1="510" y1="150" x2="640" y2="142"/>
    <line x1="640" y1="142" x2="790" y2="158"/>
  </g>
  <g fill="#2563eb"><circle cx="510" cy="150" r="4"/><circle cx="640" cy="142" r="4"/><circle cx="790" cy="158" r="4"/></g>

  <!-- 底层密集网 -->
  <text x="560" y="206" class="sub" fill="#1e40af">底层密集：小范围精挑</text>
  <g stroke="#bfdbfe" stroke-width="1">
    <line x1="510" y1="240" x2="560" y2="270"/><line x1="560" y1="270" x2="620" y2="250"/>
    <line x1="620" y1="250" x2="680" y2="290"/><line x1="680" y1="290" x2="740" y2="270"/>
    <line x1="740" y1="270" x2="790" y2="300"/><line x1="560" y1="270" x2="600" y2="320"/>
    <line x1="620" y1="250" x2="660" y2="220"/><line x1="680" y1="290" x2="640" y2="330"/>
    <line x1="510" y1="240" x2="540" y2="300"/><line x1="740" y1="270" x2="700" y2="330"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="510" cy="240" r="4"/><circle cx="560" cy="270" r="4"/><circle cx="620" cy="250" r="4"/>
    <circle cx="680" cy="290" r="4"/><circle cx="740" cy="270" r="4"/><circle cx="790" cy="300" r="4"/>
    <circle cx="600" cy="320" r="4"/><circle cx="660" cy="220" r="4"/><circle cx="640" cy="330" r="4"/>
    <circle cx="540" cy="300" r="4"/><circle cx="700" cy="330" r="4"/>
  </g>
  <!-- 跳跃路径 -->
  <path d="M510 150 L640 142 L620 250 L680 290 L660 220" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <circle cx="660" cy="220" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="138" class="sub" fill="#b91c1c" font-weight="700">起点</text>

  <text x="654" y="378" class="body" fill="#1e40af">每步朝"离问句更近"的邻居跳，直到跳不动</text>
  <text x="654" y="398" class="body" fill="#1e40af">分层防止原地打转：先上高速，再进小巷</text>
  <text x="654" y="418" class="sub" fill="#3b82f6">几十跳 = 几百次点积，就到目的地</text>
</svg>
