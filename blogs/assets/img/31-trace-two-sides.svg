<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">链路追踪：追不进黑盒，就拍黑盒门口的进出</title>
  <desc id="d">模型内部是黑盒，决策链路追不进去也没必要（回扣 01/24 决策祛魅）。但模型外面那圈 harness 是透明的，可以拍下模型每次调用的门口两侧：进=完整 Context（system 历史 检索结果 工具返回 当前问句），出=模型吐的 JSON（内容 tool_use stop_reason）加 token 数，还要记 harness 执行了哪个工具走了哪条分支。最容易漏的是只拍出不拍进，导致模型说了蠢话却不知喂了它什么（回扣 20 garbage in）。把每次调用的进出快照串起来就是一棵 trace 树：一次任务向下连出调用一到调用三的主链，中间调用二分叉出并行的子 agent（回扣 25 编排）。trace 就是所有跨越模型边界的进出串成的树。</desc>
  <style>
    .h    { font-weight: 700; fill: #1a1a1a; font-size: 17px; }
    .lbl  { font-weight: 700; font-size: 13.5px; }
    .sub  { font-size: 11px; fill: #6b7280; }
    .tag  { font-weight: 700; font-size: 12.5px; }
    .warn { font-weight: 700; font-size: 12px; fill: #b91c1c; }
    .nd   { font-weight: 700; font-size: 12px; fill: #1a1a1a; }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="30" y="34" class="h">链路追踪：追不进模型黑盒，但拍得下它门口的进出</text>

  <!-- ===== top: the door ===== -->
  <!-- input box -->
  <rect x="34" y="92" width="292" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="50" y="120" class="lbl" fill="#1e40af">进：完整 Context</text>
  <text x="50" y="144" class="sub" fill="#1e40af">system · 历史 · 检索 · 工具返回 · 问句</text>
  <text x="50" y="160" class="sub">（回扣 17 六类，harness 每轮现场拼）</text>

  <!-- black box -->
  <rect x="392" y="90" width="156" height="80" rx="8" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="470" y="126" class="lbl" fill="#ffffff" text-anchor="middle" font-size="16">模型（黑盒）</text>
  <text x="470" y="150" fill="#cbd5e1" font-size="10.5" text-anchor="middle">内部追不进 · 也没必要</text>

  <!-- output box -->
  <rect x="614" y="92" width="292" height="76" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.8"/>
  <text x="630" y="120" class="lbl" fill="#166534">出：JSON + token 数</text>
  <text x="630" y="144" class="sub" fill="#166534">内容 · tool_use · stop_reason</text>
  <text x="630" y="160" class="sub">（回扣 18/24，这一步说了啥、要不要继续）</text>

  <!-- arrows in/out -->
  <line x1="326" y1="130" x2="388" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="548" y1="130" x2="610" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- harness recorder note -->
  <text x="470" y="196" class="tag" fill="#334155" text-anchor="middle">harness 记录器：门口两侧都拍照 + 记下执行了哪个工具、走了哪条分支</text>

  <!-- red warning -->
  <rect x="34" y="212" width="872" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="52" y="238" class="warn">⚠ 最易漏：只拍「出」不拍「进」→ 模型说了蠢话，你却不知喂了它什么（回扣 20 garbage in）</text>

  <!-- ===== bottom: trace tree ===== -->
  <text x="34" y="292" class="tag" fill="#1a1a1a">trace = 把每次调用的「进/出快照」串成一棵树（Agent 转几圈 = 几个节点）</text>

  <!-- main chain y ~ 330 -->
  <rect x="34" y="330" width="96" height="46" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="82" y="352" class="nd" text-anchor="middle">一次任务</text>
  <text x="82" y="368" class="sub" text-anchor="middle">（根）</text>

  <rect x="164" y="333" width="80" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="204" y="358" class="nd" text-anchor="middle" fill="#1e40af">调用①</text>

  <rect x="278" y="336" width="62" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="309" y="357" class="sub" text-anchor="middle">工具</text>

  <rect x="374" y="333" width="80" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="414" y="358" class="nd" text-anchor="middle" fill="#1e40af">调用②</text>

  <rect x="488" y="336" width="62" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="519" y="357" class="sub" text-anchor="middle">工具</text>

  <rect x="584" y="333" width="146" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="657" y="358" class="nd" text-anchor="middle" fill="#166534">调用③（end_turn）</text>

  <!-- chain arrows -->
  <line x1="130" y1="353" x2="162" y2="353" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="244" y1="353" x2="276" y2="353" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="340" y1="353" x2="372" y2="353" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="454" y1="353" x2="486" y2="353" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="550" y1="353" x2="582" y2="353" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- branch from 调用② down to sub-agents -->
  <line x1="414" y1="373" x2="414" y2="404" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="330" y1="404" x2="498" y2="404" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="330" y1="404" x2="330" y2="430" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="498" y1="404" x2="498" y2="430" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="286" y="432" width="90" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="331" y="453" class="sub" text-anchor="middle" fill="#5b21b6">子 agent</text>
  <rect x="454" y="432" width="90" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="499" y="453" class="sub" text-anchor="middle" fill="#5b21b6">子 agent</text>
  <text x="562" y="453" class="sub" fill="#5b21b6">并行分枝（回扣 25 编排）</text>

  <!-- bottom conclusion -->
  <text x="34" y="506" class="tag" fill="#1a1a1a">每个节点 = 一次进/出快照；trace = 所有跨越模型边界的进出，串成一棵树。</text>
</svg>
