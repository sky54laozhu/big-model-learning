<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">显存带宽瓶颈：搬一次 140GB 只服务一个 token</title>
  <desc id="d">单用户解码时，要把整整140GB权重从显存搬给GPU核心，却只为推动一个token前进一步。几千个核心活一下就干完，集体空等下一轮权重搬运。卡脖子的不是算力，而是权重搬运带宽。</desc>
  <style>
    .h { font-weight: 700; fill: #1a1a1a; text-anchor: middle; font-size: 18px; }
    .body { fill: #2a2a2a; font-size: 12.5px; text-anchor: middle; }
    .sub { fill: #6b7280; font-size: 12px; text-anchor: middle; }
    .lab { fill: #ffffff; font-weight: 600; font-size: 13px; text-anchor: middle; }
  </style>

  <text x="440" y="32" class="h">单用户解码：搬一次 140GB，只推动一个 token</text>

  <!-- 显存 -->
  <rect x="40" y="66" width="180" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="66" width="180" height="28" rx="8" fill="#1e40af"/>
  <rect x="40" y="80" width="180" height="14" fill="#1e40af"/>
  <text x="130" y="85" class="lab">显存 VRAM</text>
  <rect x="62" y="108" width="136" height="92" rx="4" fill="#bfdbfe"/>
  <text x="130" y="150" class="body" fill="#1e40af" font-weight="700">140GB 权重</text>
  <text x="130" y="172" class="sub" fill="#1e40af">全部要被搬出</text>

  <!-- 搬运箭头 -->
  <line x1="224" y1="140" x2="356" y2="140" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
  <text x="290" y="128" class="sub" fill="#b91c1c" font-weight="700">搬 140GB</text>
  <text x="290" y="160" class="sub" fill="#b91c1c">(瓶颈在这条带宽)</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- GPU 核心 -->
  <rect x="360" y="66" width="300" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="360" y="66" width="300" height="28" rx="8" fill="#166534"/>
  <rect x="360" y="80" width="300" height="14" fill="#166534"/>
  <text x="510" y="85" class="lab">GPU 几千核心</text>
  <!-- grid of cores, mostly idle -->
  <g>
    <rect x="384" y="108" width="18" height="18" rx="2" fill="#16a34a"/>
    <rect x="408" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="432" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="456" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="480" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="504" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="528" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="552" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="576" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="600" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="624" y="108" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="384" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="408" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="432" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="456" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="480" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="504" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="528" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="552" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="576" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="600" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
    <rect x="624" y="132" width="18" height="18" rx="2" fill="#d1d5db"/>
  </g>
  <text x="510" y="172" class="body" fill="#166534">1 个忙 · 一大片在空等</text>
  <text x="510" y="194" class="sub" fill="#b91c1c">只处理 1 个 token 的向量</text>

  <!-- 底部 -->
  <rect x="40" y="232" width="620" height="0" fill="none"/>
  <rect x="40" y="240" width="800" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="262" text-anchor="middle" fill="#92400e" font-weight="700" font-size="13">显存带宽瓶颈：卡脖子的不是“算得快”，是“权重搬得快”</text>
  <text x="440" y="282" text-anchor="middle" fill="#92400e" font-size="12">为搬一次 140GB 付了全价，却只服务一个 token —— 这就是“一次伺候一个”的浪费</text>
</svg>
