<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">折叠点①：闸门放哪——每个工具自查 vs loop 一处收口</title>
  <desc id="d">左（✗）：把权限检查抄进每个工具（bash.ts/write_file.ts/edit_file.ts 各带一份 🔒），安全逻辑散落 N 处，每加一个工具再写一遍、漏一个就是破口。右（✓）：像 Web 中间件那样，所有工具调用都先穿过 loop 里唯一一道闸门 checkPermission 再 execute。工具管能力、闸门管权限，加工具零改动。真源码同款：hasPermissionsToUseTool 由 loop 调，不是每工具自查。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">闸门放哪：抄进每个工具，还是 loop 一处收口？</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#475569">像后端权限校验——写进每个 controller，还是挂一个中间件？</text>

  <!-- 左：每工具自查 ✗ -->
  <text x="226" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">✗ A：装进每个工具自查</text>
  <rect x="40" y="104" width="372" height="250" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="66" y="122" width="230" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="181" y="144" text-anchor="middle" font-size="11.5" fill="#475569">bash.ts　＋　🔒 自查逻辑</text>
  <rect x="66" y="164" width="230" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="181" y="186" text-anchor="middle" font-size="11.5" fill="#475569">write_file.ts　＋　🔒 再写一遍</text>
  <rect x="66" y="206" width="230" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="181" y="228" text-anchor="middle" font-size="11.5" fill="#475569">edit_file.ts　＋　🔒 又写一遍</text>
  <text x="181" y="264" text-anchor="middle" font-size="11.5" fill="#64748b">……第 N 个工具　＋　🔒 还得写</text>
  <rect x="58" y="284" width="356" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="236" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">安全逻辑散落 N 处</text>
  <text x="236" y="326" text-anchor="middle" font-size="11" fill="#7f1d1d">加工具就多一个可能忘记上锁的口子</text>

  <!-- 右：loop 一处收口 ✓ -->
  <text x="634" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">✓ B：loop 一处收口（中间件式）</text>
  <rect x="448" y="104" width="372" height="250" rx="9" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>

  <!-- 工具集 -->
  <rect x="466" y="128" width="128" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="530" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">每次工具调用</text>
  <text x="530" y="172" text-anchor="middle" font-size="11" fill="#64748b">read_file</text>
  <text x="530" y="192" text-anchor="middle" font-size="11" fill="#64748b">list_dir</text>
  <text x="530" y="212" text-anchor="middle" font-size="11" fill="#64748b">write_file</text>
  <text x="530" y="232" text-anchor="middle" font-size="11" fill="#64748b">edit_file</text>
  <text x="530" y="252" text-anchor="middle" font-size="11" fill="#64748b">bash</text>

  <!-- 汇聚箭头 -->
  <line x1="594" y1="180" x2="638" y2="180" stroke="#166534" stroke-width="2.4"/>
  <polygon points="642,180 630,174 630,186" fill="#166534"/>
  <text x="618" y="172" text-anchor="middle" font-size="9.5" fill="#166534">全部穿过</text>

  <!-- 唯一闸门 -->
  <rect x="644" y="150" width="158" height="60" rx="9" fill="#fffbeb" stroke="#1e293b" stroke-width="2.4"/>
  <text x="723" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">唯一一道闸门</text>
  <text x="723" y="196" text-anchor="middle" font-size="10.5" font-family="'SF Mono', Menlo, monospace" fill="#92400e">checkPermission()</text>

  <line x1="723" y1="210" x2="723" y2="242" stroke="#166534" stroke-width="2.4"/>
  <polygon points="723,246 717,234 729,234" fill="#166534"/>
  <rect x="644" y="248" width="158" height="34" rx="7" fill="#ffffff" stroke="#166534" stroke-width="1.6"/>
  <text x="723" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">放行才 execute</text>
  <text x="634" y="308" text-anchor="middle" font-size="11" fill="#166534">加工具只是往清单塞对象，安全零改动</text>
  <text x="634" y="328" text-anchor="middle" font-size="11" fill="#166534">——像中间件挂在所有危险路由前</text>

  <!-- 底部收口 -->
  <rect x="40" y="372" width="780" height="78" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">工具管「能力」，闸门管「权限」——关注点分离</text>
  <text x="430" y="422" text-anchor="middle" font-size="11.5" fill="#b45309">真源码同款：hasPermissionsToUseTool（CanUseToolFn）由 loop 调，不是每个工具自查</text>
  <text x="430" y="440" text-anchor="middle" font-size="10.5" fill="#a16207">loop 里 tool.execute() 那一行，是所有工具调用的唯一收口——闸门插在它前面，一处覆盖全部</text>
</svg>
