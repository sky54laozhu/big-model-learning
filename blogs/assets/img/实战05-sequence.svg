<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">序列图：文本边到边刷屏，工具参数全程后台攒字符串直到流结束</title>
  <desc id="d">runAgent、provider（内部含 SSE 读取）、模型 API 三条泳道。beat1：用户提问进入循环，provider 发起 stream:true 的请求。beat2：SSE 的 text_delta 陆续到达，provider 同步调 onToken，loop 把它 write 到 stdout，屏幕逐字刷新，这是唯一"看得见"的实时线。beat3：若这一轮模型还请求了工具，input_json_delta 只在 provider 内部悄悄累加成字符串，屏幕上没有任何变化。beat4：流结束（message_delta 的 stop_reason 或字面量 [DONE]），provider 才把攒好的 tool_use 参数字符串一次性 safeParse，返回完整 ChatReply。beat5：loop 照实战04 的老路子过权限闸门、执行工具、把结果塞回消息历史，进入下一轮。底部红字点题：文本 token 这条线是实时的，工具参数这条线全程在后台攒字符串，直到流结束才现身——这就是"文本流式、工具仍是收完整包再执行"的字面意思。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">时序：文本边到边刷屏，工具参数在后台悄悄攒着</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#475569">三条泳道：runAgent（loop.ts）· provider chat()（含 SSE 读取）· 模型 API</text>

  <!-- 泳道头 -->
  <rect x="40" y="70" width="220" height="36" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">runAgent（loop.ts）</text>
  <rect x="340" y="70" width="220" height="36" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">provider · chat()（含 SSE 读取）</text>
  <rect x="640" y="70" width="220" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="750" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">模型 API</text>

  <!-- 生命线 -->
  <line x1="150" y1="106" x2="150" y2="596" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="450" y1="106" x2="450" y2="596" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="750" y1="106" x2="750" y2="596" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- beat1 -->
  <text x="46" y="128" font-size="11" font-weight="700" fill="#334155">beat1 · 发起请求</text>
  <line x1="150" y1="140" x2="444" y2="140" stroke="#475569" stroke-width="1.8"/>
  <polygon points="450,140 438,135 438,145" fill="#475569"/>
  <text x="300" y="135" text-anchor="middle" font-size="10" fill="#334155">chat(messages, tools, onToken)</text>

  <line x1="450" y1="166" x2="744" y2="166" stroke="#475569" stroke-width="1.8"/>
  <polygon points="750,166 738,161 738,171" fill="#475569"/>
  <text x="600" y="161" text-anchor="middle" font-size="10" fill="#334155">POST .../v1/messages 或 /chat/completions（stream:true）</text>

  <!-- beat2 -->
  <text x="46" y="200" font-size="11" font-weight="700" fill="#92400e">beat2 · 文本边到边（唯一实时可见的一条线）</text>

  <line x1="744" y1="222" x2="456" y2="222" stroke="#b45309" stroke-width="1.6" stroke-dasharray="3 3"/>
  <polygon points="450,222 462,217 462,227" fill="#b45309"/>
  <text x="600" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">text_delta ×N（陆续到达）</text>

  <line x1="444" y1="246" x2="156" y2="246" stroke="#b45309" stroke-width="1.6" stroke-dasharray="3 3"/>
  <polygon points="150,246 162,241 162,251" fill="#b45309"/>
  <text x="300" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">onToken(chunk) ×N</text>

  <rect x="40" y="258" width="220" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="150" y="276" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">process.stdout.write(chunk)</text>
  <text x="150" y="292" text-anchor="middle" font-size="9.5" fill="#92400e">屏幕逐字刷新——这才是「边到边」</text>

  <!-- beat3 -->
  <text x="46" y="336" font-size="11" font-weight="700" fill="#334155">beat3 · 工具参数悄悄攒着（若这轮模型点了工具，屏幕无变化）</text>
  <rect x="340" y="348" width="220" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="450" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">input_json_delta →</text>
  <text x="450" y="380" text-anchor="middle" font-size="10" fill="#334155">inputJson += partial_json</text>
  <text x="450" y="394" text-anchor="middle" font-size="9" fill="#64748b">（仅 provider 内部累加，屏幕无变化）</text>
  <line x1="560" y1="374" x2="600" y2="374" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="600" y1="374" x2="600" y2="358" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="600" y1="358" x2="562" y2="358" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="560,358 570,354 570,362" fill="#94a3b8"/>
  <text x="632" y="370" text-anchor="middle" font-size="9" fill="#64748b">自循环</text>

  <!-- beat4 -->
  <text x="46" y="430" font-size="11" font-weight="700" fill="#166534">beat4 · 流结束，一次性解析</text>
  <line x1="744" y1="446" x2="456" y2="446" stroke="#166534" stroke-width="1.8"/>
  <polygon points="450,446 462,441 462,451" fill="#166534"/>
  <text x="600" y="441" text-anchor="middle" font-size="10" fill="#166534">message_delta(stop_reason) / 字面量 [DONE]</text>

  <rect x="340" y="458" width="220" height="50" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="450" y="476" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">流结束 → safeParse(inputJson) 一次</text>
  <text x="450" y="492" text-anchor="middle" font-size="9.5" fill="#166534">返回 ChatReply{ text, toolCalls }</text>

  <line x1="444" y1="522" x2="156" y2="522" stroke="#475569" stroke-width="1.8"/>
  <polygon points="150,522 162,517 162,527" fill="#475569"/>
  <text x="300" y="517" text-anchor="middle" font-size="10" fill="#334155">return ChatReply</text>

  <!-- beat5 -->
  <text x="46" y="546" font-size="11" font-weight="700" fill="#334155">beat5 · 工具执行，实战04 老路子不变</text>
  <rect x="40" y="558" width="220" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="150" y="577" text-anchor="middle" font-size="10" fill="#475569">权限闸门 → tool.execute()（不变）</text>

  <!-- 收口 -->
  <rect x="40" y="608" width="820" height="76" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">屏幕上"看得见"的只有文本 token 这一条线是实时的</text>
  <text x="450" y="654" text-anchor="middle" font-size="10.5" fill="#b91c1c">工具参数这条线全程在后台攒字符串，直到流结束才现身——"文本流式、工具仍收完整包再执行"的字面意思</text>
  <text x="450" y="674" text-anchor="middle" font-size="10" fill="#94a3b8">结果塞回 messages → 下一轮 chat()，循环继续（实战02 定下、本章未改）</text>
</svg>
