<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">骨架定位图：agent loop 裹住实战01 的芯片，并长出第一只手</title>
  <desc id="d">本章新增的是 agent loop（runAgent），它套在实战01 已有的 provider 层外面：循环里 chat(messages, tools) 调 provider 层（灰=已有）再到双端 API；模型要工具时 loop 执行工具 read_file（本章新增的第一只手），结果塞回 messages 转下一轮，模型不再要工具就 return text。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">骨架定位：循环裹住芯片，长出第一只手</text>
  <text x="410" y="56" text-anchor="middle" font-size="13.5" fill="#475569">本章新增 = while 循环 + 第一个工具；实战01 的 provider 层原样复用</text>

  <!-- 调用方 -->
  <rect x="40" y="78" width="200" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">调用方 index.ts</text>
  <line x1="140" y1="120" x2="140" y2="150" stroke="#334155" stroke-width="2"/>
  <polygon points="140,154 134,142 146,142" fill="#334155"/>
  <text x="196" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">runAgent(input)</text>

  <!-- agent loop 本章新增 -->
  <rect x="40" y="154" width="392" height="238" rx="10" fill="#eff6ff" stroke="#1e293b" stroke-width="2.8"/>
  <text x="56" y="178" font-size="13.5" font-weight="700" fill="#1e293b">agent loop · runAgent()　← 本章新增</text>
  <text x="56" y="196" font-size="11" fill="#64748b">for turn ≤ maxTurns（「炸」的护栏）</text>

  <rect x="60" y="208" width="352" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="236" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">① chat(messages, tools)</text>

  <rect x="60" y="256" width="352" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="236" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">② toolCalls 非空？→ 执行工具</text>

  <rect x="60" y="304" width="352" height="34" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1.6"/>
  <text x="236" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">③ 空 → return text（收工）</text>

  <!-- 回环箭头 ②→① -->
  <path d="M 60 273 L 40 273 L 40 225 L 58 225" fill="none" stroke="#b45309" stroke-width="2"/>
  <polygon points="62,225 50,219 50,231" fill="#b45309"/>
  <text x="48" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309" transform="rotate(-90 48 255)">结果塞回 messages，转下一轮</text>

  <!-- provider 层 已有 -->
  <rect x="510" y="170" width="270" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="645" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">provider 层（实战01 已有）</text>
  <text x="645" y="211" text-anchor="middle" font-size="10.5" fill="#64748b">入口/出口翻译，对循环零分支</text>

  <!-- API -->
  <rect x="510" y="240" width="270" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="645" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">双端 API · Anthropic / GLM</text>

  <!-- 工具 read_file 本章 -->
  <rect x="510" y="320" width="270" height="54" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
  <text x="645" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">工具 read_file（本章新增）</text>
  <text x="645" y="361" text-anchor="middle" font-size="10.5" fill="#92400e">给金鱼的第一只手，harness 按名字调</text>

  <!-- 连线：① chat → provider -->
  <line x1="412" y1="225" x2="506" y2="197" stroke="#2563eb" stroke-width="2"/>
  <polygon points="510,196 497,195 501,206" fill="#2563eb"/>
  <text x="460" y="205" text-anchor="middle" font-size="10" fill="#1e40af">chat</text>
  <!-- provider → API -->
  <line x1="645" y1="224" x2="645" y2="236" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="645,240 639,228 651,228" fill="#94a3b8"/>
  <!-- ② 执行 → tool -->
  <line x1="412" y1="273" x2="506" y2="330" stroke="#b45309" stroke-width="2"/>
  <polygon points="510,332 497,328 500,339" fill="#b45309"/>
  <text x="462" y="317" text-anchor="middle" font-size="10" fill="#92400e">execute(args)</text>

  <!-- 图例 -->
  <rect x="40" y="410" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="66" y="421" font-size="11.5" fill="#475569">实战01 已有</text>
  <rect x="200" y="410" width="18" height="14" rx="3" fill="#eff6ff" stroke="#1e293b" stroke-width="2"/>
  <text x="226" y="421" font-size="11.5" fill="#1e293b">本章新增：while 循环 + 第一个工具 read_file</text>
</svg>
