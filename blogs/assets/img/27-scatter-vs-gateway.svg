<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">散在 N 处 vs 网关收口</title>
  <desc id="d">左边没有网关：三个业务服务各自直连三家厂商，每个服务内部都重复塞着「挑模型+failover+密钥+算账」四块横切逻辑；右边有网关：三个业务服务只对一层 LLM 网关说话，四块横切逻辑收口进网关一层，网关再统一对接三家厂商。病因是同一件事散在 N 处，网关把横切关注点收口到一层。</desc>
  <style>
    .h  { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .sub{ font-weight: 700; font-size: 14px; }
    .bx { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .bs { font-size: 10.5px; text-anchor: middle; }
    .lb { font-size: 11.5px; text-anchor: middle; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ef4444"/></marker>
  </defs>

  <text x="34" y="32" class="h">同一件横切的事：散在 N 处　vs　收口到网关一层</text>

  <!-- divider -->
  <line x1="450" y1="58" x2="450" y2="430" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: no gateway ============ -->
  <text x="40" y="72" class="sub" fill="#b91c1c">❌ 没有网关：横切逻辑重复 N 遍</text>

  <!-- services with repeated red badge -->
  <g>
    <rect x="40" y="92" width="150" height="70" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="115" y="112" class="bx" fill="#334155">订单服务</text>
    <rect x="52" y="122" width="126" height="30" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="115" y="141" class="bs" fill="#b91c1c">挑模型·failover·密钥·算账</text>
  </g>
  <g>
    <rect x="40" y="178" width="150" height="70" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="115" y="198" class="bx" fill="#334155">客服服务</text>
    <rect x="52" y="208" width="126" height="30" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="115" y="227" class="bs" fill="#b91c1c">挑模型·failover·密钥·算账</text>
  </g>
  <g>
    <rect x="40" y="264" width="150" height="70" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="115" y="284" class="bx" fill="#334155">标签服务</text>
    <rect x="52" y="294" width="126" height="30" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="115" y="313" class="bs" fill="#b91c1c">挑模型·failover·密钥·算账</text>
  </g>

  <!-- providers left -->
  <rect x="330" y="96" width="96" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="378" y="121" class="bx" fill="#475569">Anthropic</text>
  <rect x="330" y="193" width="96" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="378" y="218" class="bx" fill="#475569">OpenAI</text>
  <rect x="330" y="290" width="96" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="378" y="315" class="bx" fill="#475569">GLM</text>

  <!-- messy crossing arrows -->
  <line x1="192" y1="118" x2="328" y2="116" stroke="#ef4444" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="192" y1="132" x2="328" y2="208" stroke="#ef4444" stroke-width="1.2" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="192" y1="213" x2="328" y2="205" stroke="#ef4444" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="192" y1="228" x2="328" y2="300" stroke="#ef4444" stroke-width="1.2" opacity="0.7" marker-end="url(#arr)"/>
  <line x1="192" y1="299" x2="328" y2="298" stroke="#ef4444" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="192" y1="285" x2="328" y2="128" stroke="#ef4444" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>

  <text x="230" y="360" class="lb" fill="#b91c1c">四块逻辑 ×3 份，线路交叉</text>

  <!-- ============ RIGHT: with gateway ============ -->
  <text x="472" y="72" class="sub" fill="#166534">✅ 有网关：横切逻辑收口一处</text>

  <!-- services right -->
  <rect x="470" y="96" width="118" height="40" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="529" y="116" class="bx" fill="#334155">订单服务</text>
  <text x="529" y="130" class="bs" fill="#64748b">只说统一格式</text>
  <rect x="470" y="193" width="118" height="40" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="529" y="213" class="bx" fill="#334155">客服服务</text>
  <text x="529" y="227" class="bs" fill="#64748b">只说统一格式</text>
  <rect x="470" y="290" width="118" height="40" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="529" y="310" class="bx" fill="#334155">标签服务</text>
  <text x="529" y="324" class="bs" fill="#64748b">只说统一格式</text>

  <!-- gateway -->
  <rect x="630" y="120" width="118" height="188" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="689" y="150" class="bx" fill="#1e40af" font-size="14">LLM 网关</text>
  <rect x="644" y="166" width="90" height="126" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="689" y="190" class="bs" fill="#166534" font-weight="700">收口一处</text>
  <text x="689" y="212" class="bs" fill="#166534">挑模型</text>
  <text x="689" y="232" class="bs" fill="#166534">failover</text>
  <text x="689" y="252" class="bs" fill="#166534">密钥</text>
  <text x="689" y="272" class="bs" fill="#166534">算账</text>

  <!-- providers right -->
  <rect x="792" y="118" width="92" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="838" y="141" class="bx" fill="#475569">Anthropic</text>
  <rect x="792" y="196" width="92" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="838" y="219" class="bx" fill="#475569">OpenAI</text>
  <rect x="792" y="274" width="92" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="838" y="297" class="bx" fill="#475569">GLM</text>

  <!-- clean arrows: services -> gateway -->
  <line x1="590" y1="116" x2="628" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="213" x2="628" y2="213" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="310" x2="628" y2="256" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- gateway -> providers -->
  <line x1="750" y1="180" x2="790" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="750" y1="214" x2="790" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="750" y1="248" x2="790" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="689" y="360" class="lb" fill="#166534">一份逻辑，线路清爽</text>

  <!-- bottom takeaway -->
  <text x="450" y="410" class="lb">病因 = 同一件横切的事散在 N 处（改模型 / failover / 密钥 / 算账，同一个病因长出的四个疮）</text>
  <text x="450" y="432" class="lb" fill="#1e40af">药 = 网关：把横切关注点从业务里请出来，收口到统一入口这一层</text>
</svg>
