<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">宽化：let 放宽成整片区域，const 精确成一个点</title>
  <desc id="d">同一个初始值 hello，let a 因为以后能重新赋值，推断结果放宽成整个 string 集合；const b 因为锁死不再变，推断结果精确成只装 hello 一个值的单元素集合。</desc>
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="420" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">宽化：let 放宽成整片区域，const 精确成一个点</text>
  <text x="420" y="60" text-anchor="middle" font-size="13.5" fill="#475569">同一个初始值 "hello"，推断出的集合大小完全不同</text>

  <!-- code boxes -->
  <rect x="105" y="80" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="225" y="105" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#334155">let a = "hello"</text>

  <rect x="495" y="80" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="615" y="105" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#334155">const b = "hello"</text>

  <!-- arrows down -->
  <line x1="225" y1="120" x2="225" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="225,180 219,168 231,168" fill="#94a3b8"/>

  <line x1="615" y1="120" x2="615" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="615,180 609,168 621,168" fill="#94a3b8"/>

  <!-- left: string 集合（放宽后的整片区域） -->
  <ellipse cx="225" cy="310" rx="190" ry="110" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="225" y="270" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b45309">a: string</text>
  <text x="225" y="291" text-anchor="middle" font-size="12" fill="#92400e">放宽后的整片区域</text>
  <circle cx="160" cy="320" r="5" fill="#b45309"/>
  <text x="160" y="342" text-anchor="middle" font-size="11.5" fill="#92400e">"hello"</text>
  <circle cx="290" cy="320" r="5" fill="#b45309"/>
  <text x="290" y="342" text-anchor="middle" font-size="11.5" fill="#92400e">"world"</text>
  <text x="225" y="374" text-anchor="middle" font-size="12" fill="#92400e">…（还能是任何字符串）</text>

  <!-- right: 单元素集合 -->
  <ellipse cx="615" cy="310" rx="95" ry="90" fill="#dcfce7" stroke="#166534" stroke-width="2.5"/>
  <text x="615" y="278" text-anchor="middle" font-size="15.5" font-weight="700" fill="#166534">b: "hello"</text>
  <circle cx="615" cy="310" r="5" fill="#166534"/>
  <text x="615" y="332" text-anchor="middle" font-size="11.5" fill="#15803d">只有这一个元素</text>

  <!-- captions -->
  <text x="225" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">let → 以后能重新赋值 → 集合必须放宽</text>
  <text x="615" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">const → 锁死不再变 → 精确成单元素集合</text>

  <text x="420" y="490" text-anchor="middle" font-size="13" fill="#475569">这不是 let / const 各自的规则，是"类型=集合"逼出的必然结果：</text>
  <text x="420" y="510" text-anchor="middle" font-size="13" fill="#475569">槽以后可能变，集合就必须放宽到能装下所有可能，不能只装当前这一个。</text>
</svg>
