<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">主控制流程图：task_status 的 execute 按有没有 taskId 分岔</title>
  <desc id="d">模型调用 task_status 工具，execute 先分岔——没传 taskId 时遍历 taskRegistry 整张表，逐行拼出"id [状态] 描述+结果预览"的概览字符串直接返回；传了 taskId 时先按 taskId 查这一行，查不到直接返回 error，查到之后调用 buildIncrementalLog(cwd, record)：内部调 loadSessionMessages 读回这个任务自己的 transcript，按 record.outputOffset 切出新增消息段，遍历这段消息里的 assistant 工具调用，用 ToolCall.id 在同一段里找到对应的 tool 结果消息配对，轮数从 record.turnCount 往上累加，返回新增日志行 + 新的 offset + 新的 turnCount。execute 把这三者写回 taskRegistry（同时把 notified 置 true，如果这个任务已经是终态），最后拼出"状态 + （终态才有的）完整结果 + 新增工具调用记录"三段返回给模型。</desc>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">主控制流程：execute 按有没有 taskId 分两条路</text>
  <text x="450" y="46" text-anchor="middle" font-size="12" fill="#475569">■ 琥珀色 = 本章新增/改动　　▨ 灰色虚线 = 沿用旧实现，未改动</text>

  <!-- 入口 -->
  <rect x="340" y="60" width="220" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="450" y="88" text-anchor="middle" font-size="10.5" fill="#475569">task_status.execute(args)</text>

  <line x1="450" y1="106" x2="450" y2="128" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(450,132) rotate(90)"/>

  <!-- 决策菱形 -->
  <polygon points="450,137 580,182 450,227 320,182" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">args.taskId 有值吗？</text>
  <text x="450" y="196" text-anchor="middle" font-size="8.6" fill="#a16207">（折叠点⑨：两种问法）</text>

  <!-- 左分支：否 -->
  <line x1="360" y1="205" x2="190" y2="258" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(190,262) rotate(126)"/>
  <text x="255" y="238" text-anchor="middle" font-size="9.4" font-weight="700" fill="#92400e">否（不传）</text>

  <!-- 右分支：是 -->
  <line x1="540" y1="205" x2="700" y2="258" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(700,262) rotate(54)"/>
  <text x="648" y="238" text-anchor="middle" font-size="9.4" font-weight="700" fill="#92400e">是（传了）</text>

  <!-- 左列：概览分支 -->
  <rect x="40" y="272" width="300" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="190" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">遍历 taskRegistry.values()</text>
  <text x="190" y="312" text-anchor="middle" font-size="8.4" fill="#a16207">size===0 → 直接返回</text>
  <text x="190" y="327" text-anchor="middle" font-size="8.4" fill="#a16207">『当前没有任何后台任务。』</text>
  <text x="190" y="346" text-anchor="middle" font-size="8.4" fill="#a16207">否则每行拼：</text>
  <text x="190" y="361" text-anchor="middle" font-size="8" fill="#a16207">`- taskId [status] 描述(截断40)`</text>
  <text x="190" y="378" text-anchor="middle" font-size="8.4" fill="#a16207">非 running 且有 result →</text>
  <text x="190" y="393" text-anchor="middle" font-size="8" fill="#a16207">追加『：结果预览(60字)…』</text>
  <text x="190" y="410" text-anchor="middle" font-size="8" fill="#a16207">（折叠点⑨）</text>

  <line x1="190" y1="422" x2="190" y2="444" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(190,448) rotate(90)"/>

  <rect x="40" y="458" width="300" height="60" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.6"/>
  <text x="190" y="482" text-anchor="middle" font-size="9.6" font-weight="700" fill="#166534">return 概览多行字符串</text>
  <text x="190" y="500" text-anchor="middle" font-size="8" fill="#166534">lines.join('\n')</text>

  <!-- 右列：详情分支 -->
  <rect x="500" y="272" width="340" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="670" y="303" text-anchor="middle" font-size="9.6" fill="#92400e">record = taskRegistry.get(taskId)</text>

  <line x1="670" y1="324" x2="670" y2="346" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(670,350) rotate(90)"/>

  <polygon points="670,355 760,388 670,421 580,388" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="670" y="393" text-anchor="middle" font-size="9.6" font-weight="700" fill="#92400e">record 存在？</text>

  <!-- 否：查不到 -->
  <line x1="600" y1="405" x2="470" y2="450" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(470,454) rotate(126)"/>
  <text x="520" y="432" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">否</text>
  <rect x="380" y="464" width="220" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="490" y="486" text-anchor="middle" font-size="9" fill="#92400e">return `error: 找不到</text>
  <text x="490" y="500" text-anchor="middle" font-size="9" fill="#92400e">任务 ${taskId}`</text>

  <!-- 是：查到了 -->
  <line x1="670" y1="421" x2="670" y2="446" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(670,450) rotate(90)"/>
  <text x="700" y="440" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">是</text>

  <rect x="500" y="460" width="340" height="196" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="670" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">buildIncrementalLog(cwd, record)</text>
  <text x="670" y="499" text-anchor="middle" font-size="8.2" fill="#a16207">loadSessionMessages(cwd, taskId)</text>
  <text x="670" y="513" text-anchor="middle" font-size="8.2" fill="#a16207">读回子agent自己的 transcript</text>
  <text x="670" y="531" text-anchor="middle" font-size="8.2" fill="#a16207">messages.slice(record.outputOffset)</text>
  <text x="670" y="545" text-anchor="middle" font-size="8.2" fill="#a16207">切出新增消息段（折叠点⑤）</text>
  <text x="670" y="563" text-anchor="middle" font-size="8.2" fill="#a16207">遍历新增段里 assistant 的 toolCalls</text>
  <text x="670" y="577" text-anchor="middle" font-size="8.2" fill="#a16207">按 ToolCall.id 配对 tool 结果（⑥）</text>
  <text x="670" y="595" text-anchor="middle" font-size="8.2" fill="#a16207">turnCount 从 record.turnCount 累加（⑦）</text>
  <text x="670" y="613" text-anchor="middle" font-size="8.2" fill="#a16207">返回 { lines, offset, turnCount }</text>
  <text x="670" y="631" text-anchor="middle" font-size="8" fill="#a16207">（折叠点④：不只回状态，还带日志）</text>

  <line x1="670" y1="656" x2="670" y2="678" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(670,682) rotate(90)"/>

  <rect x="500" y="692" width="340" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="670" y="714" text-anchor="middle" font-size="9.6" font-weight="700" fill="#92400e">写回 taskRegistry</text>
  <text x="670" y="732" text-anchor="middle" font-size="8.2" fill="#a16207">outputOffset = offset，turnCount = turnCount</text>
  <text x="670" y="748" text-anchor="middle" font-size="8.2" fill="#a16207">notified：非 running → true，否则原样</text>
  <text x="670" y="764" text-anchor="middle" font-size="8" fill="#a16207">（折叠点③：查过就不用 drain 再报一遍）</text>

  <line x1="670" y1="788" x2="670" y2="810" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#b45309" transform="translate(670,814) rotate(90)"/>

  <rect x="500" y="824" width="340" height="96" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.6"/>
  <text x="670" y="848" text-anchor="middle" font-size="9.6" font-weight="700" fill="#166534">return 三段拼接的字符串</text>
  <text x="670" y="866" text-anchor="middle" font-size="8.2" fill="#166534">状态：xxx</text>
  <text x="670" y="881" text-anchor="middle" font-size="8.2" fill="#166534">（非 running 才有）结果：xxx</text>
  <text x="670" y="896" text-anchor="middle" font-size="8.2" fill="#166534">新增工具调用记录 / 无新增提示</text>

  <!-- 汇合 -->
  <line x1="190" y1="518" x2="190" y2="960" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="670" y1="920" x2="670" y2="960" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="190" y1="960" x2="670" y2="960" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <polygon points="-6,-5 -6,5 0,0" fill="#94a3b8" transform="translate(450,960) rotate(90)"/>
  <line x1="450" y1="964" x2="450" y2="982" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="240" y="992" width="420" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="450" y="1016" text-anchor="middle" font-size="9.6" fill="#475569">execute() 的返回字符串</text>
  <text x="450" y="1034" text-anchor="middle" font-size="8.4" fill="#64748b">被 loop.ts 塞进这一轮的 tool 消息 content，跟其他工具一视同仁</text>

  <text x="450" y="1072" text-anchor="middle" font-size="9.3" fill="#64748b">■ 琥珀色 = 本章新增/改动　　▨ 灰色虚线 = 沿用旧实现，未改动</text>
</svg>
