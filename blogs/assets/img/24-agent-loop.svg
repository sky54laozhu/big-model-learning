<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <title id="t">Agent loop：把工具调用套进 while 循环</title>
  <desc id="d">模型看 context 吐出下一步动作，harness 执行工具，结果回灌进 context，三步成环反复转。循环停不停由模型这轮吐不吐工具请求决定，API 用 stop_reason 转述：tool_use 则继续转下一圈，end_turn 则退出循环收工。</desc>
  <style>
    .h  { font-weight: 700; fill: #1a1a1a; font-size: 18px; }
    .bx { font-weight: 700; font-size: 13px; text-anchor: middle; }
    .bs { font-size: 11px; text-anchor: middle; }
    .lb { font-size: 11.5px; fill: #6b7280; }
    .cap{ font-size: 12px; text-anchor: middle; fill: #6b7280; }
  </style>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
  </defs>

  <text x="40" y="34" class="h">Agent = 把第 18 篇那一圈工具调用，套进一个 while 循环</text>

  <!-- ① 模型 -->
  <rect x="70" y="150" width="180" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="182" class="bx" fill="#1e40af">① 模型看 context</text>
  <text x="160" y="204" class="bs" fill="#1e40af">吐出下一步动作</text>

  <!-- decision -->
  <rect x="345" y="150" width="170" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="182" class="bx" fill="#92400e">继续吗？</text>
  <text x="430" y="204" class="bs" fill="#92400e">读 stop_reason</text>

  <!-- ② harness 执行 -->
  <rect x="630" y="150" width="190" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="725" y="182" class="bx" fill="#166534">② harness</text>
  <text x="725" y="204" class="bs" fill="#166534">执行工具</text>

  <!-- ③ 回灌 -->
  <rect x="630" y="320" width="190" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="725" y="352" class="bx" fill="#166534">③ 结果回灌</text>
  <text x="725" y="374" class="bs" fill="#166534">进 context</text>

  <!-- 收工 -->
  <rect x="345" y="320" width="170" height="76" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="352" class="bx" fill="#334155">end_turn</text>
  <text x="430" y="374" class="bs" fill="#334155">退出循环 ✓ 收工</text>

  <!-- arrows -->
  <!-- ① -> decision -->
  <line x1="250" y1="188" x2="343" y2="188" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- decision -> ② (tool_use) -->
  <line x1="515" y1="188" x2="628" y2="188" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="528" y="178" class="lb" fill="#166534">tool_use（还要调）</text>
  <!-- ② -> ③ -->
  <line x1="725" y1="226" x2="725" y2="318" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- decision -> 收工 (end_turn) -->
  <line x1="430" y1="226" x2="430" y2="318" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="442" y="278" class="lb" fill="#475569">end_turn（说完了）</text>

  <!-- ③ -> ① return loop (routed below all boxes) -->
  <path d="M725 396 L725 422 L160 422 L160 228" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="250" y="442" class="lb" fill="#2563eb">loop：带着新结果，回到 ① 转下一圈</text>

  <text x="440" y="478" class="cap">「自主」的字面机制：循环停不停，是模型每轮用自己的输出决定的（API 用 stop_reason 如实转述）</text>
</svg>
